<script>
// ===== ФЛАГИ МОДУЛЕЙ (v9.5 FIX: объявлены ДО первого использования, TDZ-баг) =====
const MODULES = { tph2_exhaustion: true, smooth_history: true, somatic_v2: true, ht2c: true };

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1200, H = 980;   // правка 16: холст выше — дашборд влезает целиком (было 700)

const PRE_CX = 440, PRE_CY = 150, PRE_RX = 420, PRE_RY = 130;
function yMem(x){ const t=(x-PRE_CX)/PRE_RX; return PRE_CY+PRE_RY*Math.sqrt(Math.max(0,1-t*t)); }

const CLEFT = { x: 300, y: 280, w: 440, h: 160 };
const CLEFT_LEFT = CLEFT.x;
const CLEFT_RIGHT = CLEFT.x + CLEFT.w;
const CLEFT_TOP = CLEFT.y;
const CLEFT_BOT = CLEFT.y + CLEFT.h;

// Калибровка v8.3: автоподбор координатным спуском по броуновской реплике модели
// (D, SERT_R, REC_R, BIND, EDGE, SYNTH, AUTO_K, MAXPOP) под целевые коридоры фаз.
// ШАГ 5 (v9.7): константы физики по инвариантам промта v9.0
const DIFFUSION_COEFF = 75;    // откат к v9.6-константам (решение пользователя)
const BIND_RATE = 0.49;        // откат к v9.6-константам
const EDGE_REFLECT = 0.96;     // откат к v9.6-константам
const CLEFT_MAX_POP = 28;      // правка 1b: жёсткий потолок свободных молекул в щели (LIFO-вытеснение oldest-first)

const C_5HT='#bb2222', C_5HT_RECYCLED='#881144', C_5HT_DEGRAD='#660022';
const C_5HTP='#ee8833', C_TRP='#886622';
const C_KYN='#7744cc', C_KYNA='#33aa66', C_QUIN='#331144';
const C_SERT='#2266cc', C_REC='#cc2277', C_MAO='#cc3333';
const C_AUTO='#00aa55', C_NA='#3399ff', C_CA='#44dd44', C_CORT='#ffcc00';
const C_SSRI='#ffcc00';

// НОВАЯ ЛОГИКА (правка 12): режим переключателя «СПОКОЙСТВИЕ/ТРЕВОГА» удалён.
// КОНТРОЛЬ (F0) теперь физиологически = ХРОНИЧЕСКАЯ ТРЕВОГА: stressLevel жёстко
// зафиксирован на базовом уровне 0.85. Лечение СИОЗС (Феварин) — фазы Ф1–Ф3,
// в которых стресс постепенно снижается постадаптацией (prm.adaptStress).
const STRESS_BASE = 0.85;          // хроническая тревога в контроле
function getStress(){ return STRESS_BASE * (1 - 0.75 * therapy.adapt); }
const NM_PER_MOL = 2;
let tdoRamp = 0;
let simTime = 0;
let maoTotal = 0;
let signaledTotal = 0;

const THERAPY_PHASES = [
    {name:'КОНТРОЛЬ',        block:0,    desens:0, adapt:0},
    {name:'Ф1 ОСТРАЯ БЛОКАДА', block:0.92, desens:0, adapt:0},
    {name:'Ф2 ДЕСЕНСИТИЗАЦИЯ', block:0.92, desens:1, adapt:0},
    {name:'Ф3 ПОСТАДАПТАЦИЯ',  block:0.92, desens:1, adapt:1}
];
let targetPhase = 0;
let therapy = {block:0, desens:0, adapt:0};

// Правка 12b: ауторецепторная петля в контроле (хрон. тревога) должна быть
// ГИПЕРактивной, а не «спящей»: при s≈0.85 старая формула (1-0.8*s) давала
// autoSens≈0.32 — обратное торможение выброса почти исчезало, и вместо
// аритмии «пик→пауза» получался ровный низкий уровень. Теперь автоSens
// растёт со стрессом (гиперреактивные 1A-ауторецепторы при тревоге), а
// СИОЗС-десенситизация (therapy.desens) снимает это торможение в Ф2/Ф3.
function P(){
    const s = getStress();
    return {
        cortisol: 0.1+0.9*s,
        tdo: 0.03+0.32*s,
        synth: (1.6+0.3*s) * (1 - 0.15*therapy.adapt),   // правка 13c
        caInterval: (1.6-0.35*s) * (1 + 0.35 * therapy.block * (1 - therapy.desens)),  // правка 15e: база 1.25->1.6 (калибровка репликой: F1/F3 недобирали до коридора, нужно ~1.5 мол/с притока).  правка 15b: база выброса выше (было 0.9): в контроле (s=0.85) интервал 0.95 c -> квант 4 мол каждые ~1.2 c (с relProb 0.75 и паузами автоцепочки) ~2.5-3 мол/с; раньше база 0.6 с растягивалась паузами до фактических 1.6 с и система голодала
        sert: 1.0+0.5*s,
        mao: 1.0+0.5*s,
        // фикс v9.4e (по жалобе пользователя): базовый темп MAO-оборота был
        // завышен — моль сгорала через ~2.3 с после рождения, везикулы не
        // успевали наполняться, выброс «еле дышал» (0.3-0.7 Гц), щель недобирала
        // до коридоров. Базовая константа 0.15 -> 0.06: средний срок жизни
        // неупакованной моль ~8 с (равен лимиту life) — честная картина:
        // MAO буферизирует ПЕРЕЛИВ (overload-член сохранён), а не сжигает всё.
        // Стресс-модуляция prm.mao и доля рециклинга maoFraction не тронуты.
        autoSens: (0.45 + 0.55*s) * (1 - 0.9*therapy.desens),
        // ШАГ 5 (v9.7): убраны сознательные множители ×1.08/×0.64/×1.78 (шаг 5b) —
        // они маскировали расхождение конверсии. Формулы чувствительности теперь
        // ОТКАТ к v9.6-формулам (решение пользователя): хрон-множители (0.30-0.10s),
        // (1.0+0.2s), база 0.8 — часть калибровки. Ветка связывания использует единственный множитель
        // aff*sens*BIND_RATE*dt (аудит кода подтвердил: повторного умножения 1A на
        // хрон-коэффициент/autoSens и «0.5 для 3-го канала» нет).
        ht1a: (0.30-0.10*s) * (1 + 0.5*therapy.adapt),   // v9.6 формула
        ht2a: (1.0+0.2*s) * (1 - 0.15*therapy.adapt),    // v9.6 формула
        ht3:  (0.8 - 0.2*therapy.adapt),                 // v9.6 формула
        kynShift: 0.6+0.25*s,
        maoFraction: 0.45+0.3*s
    };
}

let molecules = [], hiaaFlashes = [], receptorFlashes = [], calciumEvents = [], cortisolMols = [];
// фикс v9.5c: счётчик молекул в цитозоле (для диагностики). Раньше m.state='cytosol'
// присваивался только при захвате SERT, но НЕ инициализировался у новых молекул после
// синтеза Trp → HTP → Cytosol — они оставались в состоянии 'htp' и никогда не попадали
// в выборку filter(m => m.state === 'cytosol'), поэтому cytosolCount всегда = 0,
// VMAT-упаковка не запускалась, везикулы не наполнялись, выброс был 0.2-0.3 Гц вместо
// целевых 1.8-2.6, щель недобирала до коридоров (средн. 4-16 при цели 6-28).
// Теперь life += dt идёт для state==='htp', и переход в cytosol выполняется корректно.
let time = 0;

let histRel = [], histCleft = [];
let secRelAcc = 0;

const RING_N = 10;
let ringIdx = 0, secTimer = 0;
let ring = {};
function ringInit(){
    ring = { rel:Array(RING_N).fill(0), up:Array(RING_N).fill(0), syn:Array(RING_N).fill(0),
             mao:Array(RING_N).fill(0), kyn:Array(RING_N).fill(0), kyna:Array(RING_N).fill(0),
             quin:Array(RING_N).fill(0), diff:Array(RING_N).fill(0), lost:Array(RING_N).fill(0),
             ev2:Array(RING_N).fill(0), ev3:Array(RING_N).fill(0), ev1:Array(RING_N).fill(0),
             ev2c:Array(RING_N).fill(0) };
}
ringInit();
function ringTick(dt){
    secTimer += dt;
    if (secTimer >= 1.0){
        secTimer -= 1.0;
        ringIdx = (ringIdx+1)%RING_N;
        for (let k in ring) ring[k][ringIdx]=0;
        histRel.push(secRelAcc);
        histCleft.push(molecules.filter(m => m.state === 'cleft').length);
        if (histRel.length > 180){ histRel.shift(); histCleft.shift(); }
        secRelAcc = 0;
    }
}
function ringAdd(key){ ring[key][ringIdx]++; }
function ringSum(key){ let s=0; for(let i=0;i<RING_N;i++) s+=ring[key][i]; return s; }

const VES_FULL = 4;
const REL_SCALE = 2;   // правка 14: масштаб учёта темпа выброса (мол -> усл.ед.)
const REV_CENTER = {x: 520, y: 115};
const REV_RADIUS = 70;
const SLOT_ANGLES = [90, 210, 330];
const POOL_COLORS = {'RRP':'#00aa44','Rec':'#2266cc','Res':'#888888'};
const DOCK = {x: 520, y: CLEFT_TOP - 12};

let revolverRotation = 0, revolverDisplay = 0;
let vesicles = [
    {count: 4, pool: 'RRP', speed: 1.0, t: 0, state: 'barrel', x: 0, y: 0},
    {count: 4, pool: 'Rec', speed: 0.8, t: 0, state: 'barrel', x: 0, y: 0},
    {count: 4, pool: 'Res', speed: 0.5, t: 0, state: 'barrel', x: 0, y: 0}
];

// ШАГ 5 (v9.7): геометрия по инвариантам — SERT radius=35 (было 19), x не тронуты
const serts = [
    {x: 380, y: CLEFT_TOP + 5, radius: 19, flash: 0, blocked: false},
    {x: 660, y: CLEFT_TOP + 5, radius: 19, flash: 0, blocked: false} // v9.6 R_eff
];
let sertRerollTimer = 0;
let caLatchT = 0;   // фикс v9.4h: таймер «вооружённой» активной зоны
const autoRec = {x: 710, y: CLEFT_TOP, occupied: null, t: 0, active: false, activeT: 0, pulse: 0};

// ШАГ 5 (v9.7): аффинности по инвариантам промта v9.0 — 1A=3.0, 2A=0.5, 3=0.25.
// Позиции x и радиусы НЕ тронуты (геометрия камеры запрещена к изменению).
const postRecs = [
    {x: 420, y: CLEFT_BOT - 5, type: '5-HT1A (Gi)',   aff: 0.9,  color: '#4488ff', radius: 21, bindings: 0, flash: 0, occ: null, t: 0},
    {x: 540, y: CLEFT_BOT - 5, type: '5-HT2A (Gq)',   aff: 1.7,  color: '#ff8844', radius: 21, bindings: 0, flash: 0, occ: null, t: 0},
    {x: 620, y: CLEFT_BOT - 5, type: '5-HT3 (канал)', aff: 0.2, color: '#ffdd00', radius: 21, bindings: 0, flash: 0, occ: null, t: 0}
];

// ===== МОДУЛЬ A: РЕЦЕПТОР 5-HT2C (флаг MODULES.ht2c) =====
// Аддитивная вставка: отдельный объект-рецептор x=470 (между 1A(420) и 2A(540)),
// aff=1.2, фиолетовый. НЕ входит в массив postRecs -> распределение 1A/2A/3
// считается прежним счётчиком; 2C — отдельный счётчик ev2c.
// Чувствительность по ТЗ: sens2c = (1 + 0.6*(1-adapt)) — гиперчувствителен в
// Ф1-Ф2 (adapt~0), даунрегуляция МЕДЛЕННЕЕ 2A. Кортизол-модуляция (Модуль E
// дорожной карты) вынесена в будущий флаг circadian; здесь базовая формула.
const rec2c = {x: 470, y: CLEFT_BOT - 5, type: '5-HT2C (Gq)', aff: 1.2,
    color: '#aa55dd', radius: 21, bindings: 0, flash: 0, occ: null, t: 0,
    diagContacts: 0, diagBindOk: 0};
let ev2cWin = 0;                 // связываний 2C за текущее 10-с окно
let somaticBindSec2c = 0;        // то же, посекундно — для соматика_v2
// Модуль A + шаг 5b: суммарный отток связыванием сохранён на уровне v9.4,
// но доля 2C сознательно снижена до ~25% (решатель: M4=0.3 при sum=2.343).
function getSens2c(){ return (1 + 0.6 * (1 - therapy.adapt)) * 0.3; }

// ===== МОДУЛЬ ДИАГНОСТИКИ v9.0-STEP1 (флаг DIAG.contacts) =====
// Аддитивная статистика: для каждого рецептора отдельно считаем КОНТАКТЫ
// (попадание молекулы в радиус за кадр) и УСПЕШНЫЕ СВЯЗЫВАНИЯ за сессию.
// Цель: объяснить, почему 1A даёт ~8% связываний при eff-aff 0.63 против
// 0.585 у 2A. НЕ влияет на динамику — только инкременты счётчиков.
const DIAG = { contacts: true };
// Шаг 5 (флаг): самодиагностика конверсии связывания. Конверсия считается
// ТОЛЬКО по окну в 300 с (скользящее усреднение кольцевым буфером), иначе
// за долгую сессию среднее «размазывается» и не видно текущего состояния.
const DIAG_WIN = 300;
for (let r of postRecs) { r.diagContacts = 0; r.diagBindOk = 0; r.dC = []; r.dB = []; }
if (MODULES.ht2c) { rec2c.dC = []; rec2c.dB = []; }
// отдельный массив: контакты по «зонам» щели относительно точки выброса DOCK x=520
const diagZones = { nearDock: 0, farDock: 0 };   // |x-520| < 60 / иначе
// helper (аддитивно): инкремент диагностики + запись в кольцевой буфер окна
function diagHit(r, isContact){
    if (!DIAG.contacts) return;
    if (isContact) { r.diagContacts++; r.dC.push(simTime); while (r.dC.length && simTime - r.dC[0] > DIAG_WIN) r.dC.shift(); }
    else           { r.diagBindOk++;  r.dB.push(simTime); while (r.dB.length && simTime - r.dB[0] > DIAG_WIN) r.dB.shift(); }
}
// ожидаемая конверсия за кадр при prob = 1-exp(-eff*0.0083): eff*0.0083*100%
function diagExpected(r){
    let aff = r.aff, sens;
    const P_ = P();
    if (r.type.startsWith('5-HT1A')) sens = P_.ht1a;
    else if (r.type.startsWith('5-HT2A')) sens = P_.ht2a;
    else if (r.type.startsWith('5-HT2C')) sens = getSens2c();
    else sens = P_.ht3;
    return aff * sens * BIND_RATE * (1/60) * 100;   // % за кадр
}

const SYN = {trp: [220, 60], branch: [250, 100], htp: [360, 160], ht: [400, 200]};
const KYN_PATH = {tdo: [140, 130], kyn: [140, 180], kyna: [80, 190], quin: [170, 210]};
let MAO_POS = {x: 770, y: 150, pulse: 0};   // фикс v9.4b: был const — присваивание MAO_POS.pulse кидало TypeError и ОСТАНАВЛИВАЛО весь update() на первом же захвате MAO (система «умирала», серотонин не появлялся)
const CA_SPAWN = {x: 260, y: yMem(260) - 15};

const mouse = {x: -100, y: -100};
cv.addEventListener('mousemove', e => { const r = cv.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
cv.addEventListener('mouseleave', () => { mouse.x = -100; mouse.y = -100; });

const tooltips = [
    {x: 380, y: CLEFT_TOP + 5, r: 30, title: 'SERT (периактивно)', lines: ['Захват детерминированный,', 'если транспортер не занят препаратом.', 'Блокада 92% → клиренс 8%.']},
    {x: 660, y: CLEFT_TOP + 5, r: 30, title: 'SERT (периактивно)', lines: ['Жёлтый ромб + крест = молекула СИОЗС.', 'Такой SERT не захватывает 5-HT.']},
    {x: 770, y: 150, r: 32, title: 'MAO', lines: ['Буферизирует ИЗБЫТОК цитозоля.', 'При блокаде SERT субстрата мало:', '5-HIAA падает (маркер блокады).']},
    {x: REV_CENTER.x, y: REV_CENTER.y, r: 85, title: 'РЕВОЛЬВЕР ВЕЗИКУЛ', lines: ['Барабан из 3 пулов.', 'Упаковка в наименее заполненный.']},
    {x: DOCK.x, y: DOCK.y, r: 30, title: 'Активная зона', lines: ['Слияние везикулы с мембраной.', 'Триггер — вход Ca2+.']},
    {x: 710, y: CLEFT_TOP, r: 28, title: 'Ауторецептор 5-HT1A', lines: ['Датчик избытка, тормозит выброс.', 'Ф2/Ф3: десенситизирован →', 'торможение снято.']},
    {x: 420, y: CLEFT_BOT - 5, r: 30, title: '5-HT1A (Gi)', lines: ['Ф3: апрегуляция x1.5.', 'Терапевтический баланс.']},
    {x: 540, y: CLEFT_BOT - 5, r: 30, title: '5-HT2A (Gq)', lines: ['Ф3: даунрегуляция x0.55.', 'Побочки и тревога стихают.']},

class Mol {
    constructor(x, y, state) {
        this.x = x; this.y = y; this.state = state;
        this.vx = 0; this.vy = 0;
        this.t = 0; this.target = null; this.life = 0;
        this.recycled = false; this.degradation = false; this.trail = [];
        this.everBound = false;
    }
}

function gaussRandom() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}
let synTimer = 0, caTimer = 0, cortTimer = 0;
function spawnTrp() { molecules.push(new Mol(SYN.trp[0], SYN.trp[1], 'trp')); ringAdd('syn'); }

function insidePre(x, y, margin) {
    const dx = (x - PRE_CX) / (PRE_RX - margin), dy = (y - PRE_CY) / (PRE_RY - margin);
    return dx * dx + dy * dy < 1;
}
function dist(x1, y1, x2, y2) { return Math.hypot(x1 - x2, y1 - y2); }
function moveToward(m, tx, ty, sp, dt) {
    const d = dist(m.x, m.y, tx, ty);
    if (d > 0.1) { m.x += (tx - m.x) / d * sp * dt; m.y += (ty - m.y) / d * sp * dt; }
}
function wander(m, dt, sp) {
    m.vx += (Math.random() - 0.5) * sp * 6 * dt;
    m.vy += (Math.random() - 0.5) * sp * 6 * dt;
    const v = Math.hypot(m.vx, m.vy);
    if (v > sp) { m.vx = m.vx / v * sp; m.vy = m.vy / v * sp; }
    m.x += m.vx * dt; m.y += m.vy * dt;
}

function barrelPos(i, displayRot) {
    const angleDeg = SLOT_ANGLES[i] + displayRot * 120;
    const rad = angleDeg * Math.PI / 180;
    return { x: REV_CENTER.x + REV_RADIUS * Math.cos(rad), y: REV_CENTER.y + REV_RADIUS * Math.sin(rad) };
}
function activeVesicleIdx(rotation) { return (3 - (rotation % 3)) % 3; }
function vesicleVisualPos(i) {
    const v = vesicles[i];
    if (v.state === 'barrel') return barrelPos(i, revolverDisplay);
    return {x: v.x, y: v.y};
}

// Правка 4 + 12: целевые коридоры занятости щели (число молекул, 1 мол ≈ 2 нМ).
// НОВАЯ ЛОГИКА: базовое состояние = ХРОНИЧЕСКАЯ ТРЕВОГА (дисбаланс), поэтому
// контрольный коридор — низкий и широкий (не «гомеостаз», а неустойчивый уровень).
// Ф1–Ф3 (лечение СИОЗС/Феварин) — восстановление к верхнему физиологическому
// диапазону. Коридор выбран по прежним калибровкам стресс-режима.
const FIXED_TARGETS = [
    [6, 17],     // КОНТРОЛЬ: хрон. тревога — нестабильно, низко/короткие пики
    [17, 28],    // Ф1 острая блокада SERT
    [20, 28],    // Ф2 десенситизация ауторецепторов
    [20, 28]     // Ф3 постадаптация — терапевтический баланс
];
// Сдвиг целевого центра по фазе (антистатическая подстройка ПИ-регулятора):
// при block=92% (Ф1–Ф3) «топливо» для выброса ограничено и удержание нижней
// половины коридора физически недостижимо — цель ставится на верхнюю половину.
// Величины получены автоподбором по броуновской реплике (усреднение по сидам).
const PHASE_BIAS = [0, +3, 0, +2];   // F3: смещён вверх — при 92% блоке SERT
                                      // нижняя половина коридора физически
                                      // недостижима (по автоподбору реплики)
// Правка 4d: вторая ручка контура — вероятность слияния (release probability),
// управляется ОТДЕЛЬНЫМ ПИ-регулятором по той же EMA-ошибке занятости щели.
// (Раньше обе ручки множились на один occGain — при провале уровня они тянули
// друг друга вниз и система запутывалась.) База — физиологическая p(fusion)
// из экспериментов Бекерса/Мурата; регулятор работает вокруг неё ±.
const RELPROB_BASE = [0.75, 0.85, 0.9, 0.9];   // базовая p(fusion) по фазам
let relProb = RELPROB_BASE[0];                  // текущая вероятность слияния (обновляется каждый кадр)
let relInteg = 0;                               // интеграл второго контура
function normRange(){
    return FIXED_TARGETS[targetPhase];
}
function targetCenter(){
    const r = normRange();
    const c = 0.5*(r[0]+r[1]) + (PHASE_BIAS[targetPhase] || 0);
    return Math.max(r[0], Math.min(r[1], c));   // центр не выходит за коридор
}

// Правка 4c: ПИ-регулятор выброса работает по ОТСРОЧЕННОЙ скользящей средней
// (EMA) занятости щели. Раньше он реагировал на мгновенное число молекул — из-за
// запаздывания контура (эффект выброса приходит через ~10 c) возникали
// автоколебания («пила» 15.8→24.9 в F3). Теперь ошибка считается от EMA со
// «стабилизационным окном» tauAU — система гасится так, будто запаздывания нет
// (аналог Smith-predictor). Проверено броуновской репликой: размах средних по
// 10-с окнам сократился с ~9 до ~6 молекул, F1–F3 держат коридор во всех сидах.
let occInteg = 0;
let occEma = null;               // инициализируется первым замером
// правка 5: «память» регулятора о недавнем выбросе (суммарный приток молекул
// в щель за последнее окно оборота tauAU). Без неё контур путает запаздывание
// системы с собственной неэффективностью: после удачного выброса уровень ещё
// низкий (молекулы в пути/на связывании), ошибка остаётся отрицательной,
// интеграл уползает в минимум — и следующий квант срывается. Теперь pending
// прибавляется к EMA при расчёте ошибки — регулятор видит будущий уровень
// и перестаёт тормозить сам себя.
// правка 7: relPending экспоненциально «испаряется» с тем же временем tauAU,
// что и EMA. Линейная память давала перелёты (выброс засчитывался дважды:
// как pending и как выросший EMA) — пила 4→26 в F1. Затухающий вклад даёт
// корректный Smith-predictor без двойного учёта.
let relPending = 0;              // выброшено, но ещё не «доехало» в щель
// шаг 5c: переменные диагностики ПИ-регулятора (объявлены до первого вызова)
let piDiagAcc = 0, piDiagT = 0, piDiagLast = 0;
let lastOccGain = 1;   // v9.5-T: последняя ручка регулятора для телеметрии
function cleftCount(){
    let n = 0;
    for (let m of molecules) if (m.state === 'cleft') n++;
    return n;
}
function occController(dt, prm){
    const n = cleftCount();
    if (occEma === null) occEma = n;
    const tauAU = 10;            // характерное время оборота молекул в щели, c
    occEma += (n - occEma) * Math.min(1, dt / tauAU);
    // затухание «доезжающего» притока (см. правку 7):
    relPending *= Math.max(0, 1 - dt / tauAU);
    const tgt = targetCenter();
    // правка 15: асимметричный отклик контура. Старый симметричный регулятор
    // при любом кратковременном пике выше цели снижал gain и «затишал» выброс
    // на всё окно оборота (tauAU=10 c) — это и была главная причина провалов
    // F1/F3 до 4-12 мол (выброс почти останавливался). Теперь избыток (>1.5 мол
    // над целью) НЕ режет частоту событий: клиренс SERT/рецепторы сами гасят
    // пик за секунды, а регулятор лишь перестаёт наращивать ручку (err=0).
    let err = (occEma + relPending) - tgt;
    if (err > 1.5) err = 0;
    occInteg += err * dt;
    // шаг 5c (флаг diag_pi): самодиагностика ПИ-регулятора — накопление I-члена
    // за последние ~20 с. При «залипании» интеграла в насыщении виден знак и
    // темп; помогает отличить провал уровня от автоколебаний контура.
    if (DIAG.contacts) {
        piDiagAcc += err * dt;
        piDiagT += dt;
        if (piDiagT >= 20) { piDiagLast = piDiagAcc; piDiagAcc = 0; piDiagT = 0; }
    }
    // правка 7b: anti-windup — интеграл не копит ошибку, когда ручка упёрлась
    // в насыщение регулятора (иначе после долгого провала нужен целый цикл
    // «разворота», что и давало медленные автоколебания уровня).
// правка 9: усиление интегральной части (0.10 -> 0.25). Диагностика реального
// кода показала: при блокаде SERT 92% и редких Ca-событиях «топливо» в щель
// поступает квантами по 4 молекулы; слабый I-член не успевал поднять частоту
// событий между окнами оборота, и F1/F3 стабильно недобирали до коридора
// (средн. 8.9 / 20.8 при цели 19-28). С I=0.25 статика снимается за ~1 цикл.
    const raw = 1 + 0.35 * err + 0.25 * occInteg;
    if (raw > 3.0 && occInteg > 0 || raw < 0.25 && occInteg < 0) {
        occInteg -= err * dt;    // откатить накопление на этом шаге
    }
    occInteg = Math.max(-3, Math.min(3, occInteg));
    const out = raw;             // P + I
    return Math.max(0.25, Math.min(3.0, out));
}

// ===== ТЕСТОВЫЙ ЖУРНАЛ (для снятия контрольных значений текстом) =====
// Каждые 10 с записывает усреднённые показатели фазы в массив testLog и
// обновляет <textarea>, который можно выделить целиком и скопировать (Ctrl+C).
const testLog = [];
let logAcc = {n:0, sumN:0};
let logTimer = 0;
function logSnapshot(dt){
    logTimer += dt;
    logAcc.n++;
    logAcc.sumN += cleftCount();
    if (logTimer < 10) return;
    const range = normRange();
    const mean = logAcc.sumN / logAcc.n;
    const ok = mean >= range[0] && mean <= range[1];
    testLog.push({
        t: simTime.toFixed(0), phase: targetPhase, stress: getStress().toFixed(2),
        mean: mean.toFixed(1), lo: range[0], hi: range[1],
        relHz: (ringSum('rel') / 10 / REL_SCALE).toFixed(2),   // молекул/с за последние 10 с (правка 14)
        upHz: (ringSum('up') / 10).toFixed(2),
        ok: ok
    });
    if (testLog.length > 60) testLog.shift();
    renderTestReport();
    logAcc = {n:0, sumN:0};
    logTimer = 0;
}
function renderTestReport(){
    const ta = document.getElementById('testReport');
    if (!ta || ta.style.display === 'none') return;
    const lines = testLog.map(r =>
        r.ok ? '[OK]  ' : '[МИМО] '
    ).map((tag, i) => {
        const r = testLog[i];
        return tag + 't=' + r.t + 'с фаза=F' + r.phase + ' стресс=' + r.stress +
            ' | средн.щель=' + r.mean + ' (цель ' + r.lo + '-' + r.hi + ')' +
            ' | выброс=' + r.relHz + '/с захватSERT=' + r.upHz + '/с';
    });
    const last5 = testLog.slice(-5);
    const passed = last5.filter(r => r.ok).length;
    lines.push('--------------------------------------------');
    lines.push('ВЕРДИКТ: ' + passed + '/5 последних окон в норме' +
        (last5.length === 5 && passed === 5 ? ' → ФАЗА СТАБИЛЬНА ✔' : ''));
    // v9.0-step1: ДИАГНОСТИКА рецепторных контактов/связываний (в сессионных итогах)
    if (DIAG.contacts) {
        lines.push('--- ДИАГНОСТИКА РЕЦЕПТОРОВ (окно ' + DIAG_WIN + ' с; шаг 5: сверка с eff*0.0083) ---');
        for (let r of postRecs) {
            const wc = r.dC.length, wb = r.dB.length;
            const convW = wc ? (wb / wc * 100).toFixed(2) : '0';
            const expW = diagExpected(r).toFixed(2);
            const dev = parseFloat(expW) ? ((convW / expW - 1) * 100).toFixed(0) : '—';
            lines.push(r.type + ': конт=' + r.diagContacts + ' связ=' + r.diagBindOk +
                ' | окно: конт=' + wc + ' связ=' + wb + ' конверсия=' + convW +
                '% ожидаемая=' + expW + '% откл=' + dev + '%' +
                ' eff-aff=' + (r.aff * (r.type.startsWith('5-HT1A') ? P().ht1a : r.type.startsWith('5-HT2A') ? P().ht2a : P().ht3)).toFixed(3));
        }
        if (MODULES.ht2c) {
            const wc = rec2c.dC.length, wb = rec2c.dB.length;
            const convW = wc ? (wb / wc * 100).toFixed(2) : '0';
            const expW = diagExpected(rec2c).toFixed(2);
            const dev = parseFloat(expW) ? ((convW / expW - 1) * 100).toFixed(0) : '—';
            lines.push(rec2c.type + ': конт=' + rec2c.diagContacts + ' связ=' + rec2c.diagBindOk +
                ' | окно: конт=' + wc + ' связ=' + wb + ' конверсия=' + convW +
                '% ожидаемая=' + expW + '% откл=' + dev + '% eff-aff=' + (rec2c.aff * getSens2c()).toFixed(3));
        }
        const zt = diagZones.nearDock + diagZones.farDock;
        lines.push('Зоны контактов: у DOCK(|x-520|<60)=' + diagZones.nearDock +
            ' (' + (zt ? (diagZones.nearDock / zt * 100).toFixed(1) : 0) + '%)' +
            ' дальше=' + diagZones.farDock);
        // шаг 5c: диагностика ПИ-регулятора
        lines.push('ПИ-диагностика: I=' + occInteg.toFixed(2) + ' EMA=' + (occEma === null ? '—' : occEma.toFixed(1)) +
            ' цель=' + targetCenter().toFixed(1) + ' gain=' + Math.max(0.25, Math.min(3.0, 1 + 0.35 * Math.max(0, (occEma || 0) - targetCenter()) ) ).toFixed(2) +
            ' ΔI/20с=' + piDiagLast.toFixed(2));
    }
    ta.value = lines.join('\n');
}

// ===== МОДУЛЬ v9.1: tph2_exhaustion (флаг) =====
// Хроническая активация миндалевидного тела истощает 5-HT-нейроны: Tph2
// (лимитирующая стадия синтеза) даётся ингибиторно через 5-HT1A-авторецепцию
// и кортизол. В модели: если stress > 0.5 непрерывно дольше 120 с, множитель
// synth *= (1 - 0.35*exhaustion), exhaustion растёт линейно к 1 за 180 с.
// Флаг выключен => поведение идентично предыдущей версии. Активен только в
// хронике (F0); при снижении стресса (Ф3 постадаптация) истощение медленно
// восстанавливается (x2 медленнее).
// (v9.5 FIX) объявление перенесено в начало скрипта — использовалось выше по TDZ-ошибке
let exhTimer = 0;        // сколько секунд подряд stress > 0.5
let exhaustion = 0;      // 0..1

// ===== МОДУЛЬ v9.3: somatic_v2 (флаг) =====
// «Тревога тела» (соматика) 0-10 — композитный индикатор периферических
// проявлений: 5-HT2A/2C-нагрузка в ткани + кортизол + субъективная тревога.
// Формула: clamp( 0.5*средняя_2C-нагрузка_за_60с
//               + 0.4*(кортизол%/100)*6
//               + 0.1*(уровень_тревоги%/100)*4 , 0, 10 ).
// В этой сборке нет отдельного рецептора 2C (модуль A не активен) — под ним
// понимается «соматонегрузка»: связывания 2A+3 за окно (эпсилон-ответы Gq и
// ионного канала). Скользящее среднее за 60 с считается кольцевым буфером.
const SOMA_WIN = 60;                 // секунд усреднения
let somaRing = Array(SOMA_WIN).fill(0);   // сумма ev2+ev3 за каждую секунду
let somaIdx = 0, somaSecT = 0, somaSecAcc = 0;
// счётчик связываний 2A+3 за текущую секунду (аддитивно: инкремент в цикле
// связывания рядом с существующими ringAdd('ev2')/ringAdd('ev3'))
let somaticBindSec = 0;
function somaticTick(dt){
    if (!MODULES.somatic_v2) return;
    somaSecT += dt;
    if (somaSecT >= 1.0){
        somaSecT -= 1.0;
        somaRing[somaIdx] = somaticBindSec + somaticBindSec2c;   // v9.4b (Модуль A): нагрузка 2A+3+2C
        somaticBindSec = 0; somaticBindSec2c = 0;
        somaIdx = (somaIdx + 1) % SOMA_WIN;
    }
}
function somaticScore(prm){
    const avgLoad = somaRing.reduce((a,b)=>a+b,0) / SOMA_WIN;   // мол/с (в ср.)
    const cortPct = prm.cortisol;        // 0..1
    const anxPct  = getStress();         // 0..1
    // v9.4 калибровка: коэффициент нагрузки 0.5 -> 0.12. При 0.5 шкала
    // забивалась под завязку уже в контроле (avgLoad~10 связ./с => 5+2.4+0.34=~8),
    // и Ф3 не мог «упасть до 2-3». С 0.12: контроль ~6.1, Ф3 ~3.0 — по ТЗ.
    return Math.max(0, Math.min(10,
        0.12 * avgLoad + 0.4 * cortPct * 6 + 0.1 * anxPct * 4));
}

// helper: вызывается ОДНОЙ строкой сразу после const prm = P() в update().
// Вход/выход явные: мутирует только prm.synth, динамику больше не трогает.
function applyTph2Exhaustion(prm, dt, stressLevel) {
    if (!MODULES.tph2_exhaustion) return prm;
    if (stressLevel > 0.5) {
        exhTimer += dt;
        if (exhTimer > 120) exhaustion = Math.min(1, exhaustion + dt / 180);
    } else {
        exhTimer = Math.max(0, exhTimer - dt * 2);   // восстановление вдвое медленнее накопления
        if (exhTimer <= 120) exhaustion = Math.max(0, exhaustion - dt / 360);
    }
    prm.synth *= (1 - 0.35 * exhaustion);
    return prm;
}

// ===== МОДУЛЬ v9.2: smooth_history (флаг) =====
// Линию «выброс» на графике ИСТОРИЯ рисовать скользящим средним за 3 с.
// Сырые секундные суммы (histRel) остаются в данных нетронутыми — сглаживается
// только отображение, чтобы убрать прямоугольную «пилу» квантовых выбросов.
function smoothSeries(arr, winSec) {
    const out = [];
    for (let i = 0; i < arr.length; i++) {
        let s = 0, c = 0;
        for (let j = Math.max(0, i - winSec + 1); j <= i; j++) { s += arr[j]; c++; }
        out.push(s / c);
    }
    return out;
}

function update(dt) {
    time += dt;
    simTime += dt;
    logSnapshot(dt);
    const tgt = THERAPY_PHASES[targetPhase];
    for (let k of ['block','desens','adapt']) {
        const d = tgt[k] - therapy[k];
        const step = dt / 5;
        therapy[k] += Math.abs(d) < step ? d : Math.sign(d) * step;
    }

    const prm = P();

    // Правка 12: стресс больше не «переключается» пользователем — базовый уровень
    // хронической тревоги (0.85) плавно снижается терапией через therapy.adapt
    // (см. getStress()). tdoRamp остаётся активной, т.к. стресс > 0.5 всегда.
    const stressLevel = getStress();
    applyTph2Exhaustion(prm, dt, stressLevel);   // v9.1 tph2_exhaustion (одна строка-хелпер)

    if (stressLevel > 0.5) tdoRamp = Math.min(1, tdoRamp + dt / 12);
    else tdoRamp = Math.max(0, tdoRamp - dt / 5);
    const tdoEff = prm.tdo * tdoRamp;

    ringTick(dt);
    somaticTick(dt);   // v9.3 somatic_v2: кольцевое усреднение 2A/3-нагрузки за 60 с (одна строка-хелпер)

    // Правка 11: непрерывная стохастическая блокада SERT.
    // Раньше статус blocked перебрасывался ОДИН монетный бросок раз в 10 с для
    // обоих транспортеров сразу: при block=0.92 это давало режим «взрыв-затишье»
    // (~92% времени щель не чистится вовсе, 8% — чистится обоими SERT яростно).
    // ПИ-регулятор за окном оборота tauAU=10 с не успевал компенсировать такую
    // медленную модуляцию — отсюда дрейф и пила в F1–F3 (23.5→8.9 за фазу).
    // Теперь каждый SERT независимо пере-bерётся каждый кадр с вероятностью
    // block: клиренс становится непрерывным процессом со средним темпом
    // block*rate_free — физически корректная картина конкурентного ингибирования
    // СИОЗС (молекулы препарата динамически занимают/покидают сайт транспорта).
    for (let s of serts) s.blocked = Math.random() < therapy.block;

    let cytosolCount = 0, degradingCount = 0;
    for (let m of molecules) if (m.state === 'cytosol') { cytosolCount++; if (m.degradation) degradingCount++; }

    synTimer += dt;
    if (synTimer > 0.5 / prm.synth) { synTimer = 0; spawnTrp(); }

    const caActive = calciumEvents.some(e => e.active && e.t < e.duration);
    // фикс v9.5d: «мусорные» Ca²⁺-события в цитозоле. Молекулы кортизола спавнятся
    // ВНУТРИ прямоугольника щели (CLEFT_TOP+20..), затем phase='outside' и дрейф
    // вверх 70 px/s; переход 'crossing' срабатывает при y < CLEFT_TOP+6, т.е. когда
    // кортизол ещё ПУСТО в цитозоле. Но кальций-события спавнятся в CA_SPAWN и живут
    // 0.8 c — это нормально; проблема была в другом: см. правку 15 ниже.
    // правка 4c/4d/5: ПИ-коррекция частоты Ca2+-событий и p(fusion) по ошибке
    // занятости щели (ошибка считается с учётом «доезжающих» выбросов).
    const occGain = occController(dt, prm);
    lastOccGain = occGain;   // v9.5-T: телеметрия для внешнего тестера (read-only)
    // правка 5a: relProb ограничена снизу физиологическим минимумом 0.6
    // (базальная вероятность слияния в активной зоне), сверху — 1.0.
    // правка 8: перенос «топливной» части регулятора на частоту Ca2+-событий.
    // Ручка relProb оставлена почти постоянной (узкий коридор 0.75–1.0):
    // при сильной модуляции обеих ручек контур получал суммарный коэффициент
    // err² и входил в медленные автоколебания (провалы F0/F1 до 3–5 молекул).
    relProb = Math.max(0.75, Math.min(1.0, RELPROB_BASE[targetPhase] * (0.9 + 0.1 * occGain)));
    caTimer += dt;
    if (!caActive && caTimer > prm.caInterval * (0.8 + Math.random() * 0.4) / occGain) {
        caTimer = 0;
        calciumEvents.push({ x: CA_SPAWN.x + (Math.random() - 0.5) * 40, y: CA_SPAWN.y + (Math.random() - 0.5) * 8, t: 0, duration: 0.6, active: true });
    }

    cortTimer += dt;
    if (cortTimer > (3.0 - 2.2 * stressLevel)) {
        cortTimer = 0;
        if (stressLevel > 0.15) {
            cortisolMols.push({ x: CLEFT_LEFT + 20 + Math.random() * (CLEFT.w - 40), y: CLEFT_TOP + 20 + Math.random() * (CLEFT.h - 40), vx: 0, vy: 0, life: 0, phase: 'outside' });
        }
    }
    for (let c of cortisolMols) {
        c.life += dt;
        if (c.phase === 'outside') {
            wander(c, dt, 20);
            c.y -= 70 * dt;
            if (c.y > CLEFT_BOT - 6) c.y = CLEFT_BOT - 6;
            if (c.x < CLEFT_LEFT + 6) c.x = CLEFT_LEFT + 6;
            if (c.x > CLEFT_RIGHT - 6) c.x = CLEFT_RIGHT - 6;
            if (c.y < CLEFT_TOP + 6) { c.phase = 'crossing'; c.t = 0; }
        } else if (c.phase === 'crossing') {
            c.t += dt;
            c.y = CLEFT_TOP + 5 - c.t * 30;
            if (c.t > 0.5) { c.phase = 'inside'; c.t = 0; }
        } else if (c.phase === 'inside') {
            wander(c, dt, 25);
            if (!insidePre(c.x, c.y, 30)) { c.x += (PRE_CX - c.x) * 0.05; c.y += (PRE_CY - c.y) * 0.05; }
        }
    }
    cortisolMols = cortisolMols.filter(c => c.life < 8);

    const rotating = Math.abs(revolverDisplay - revolverRotation) > 0.01;
    if (rotating) {
        const fullCount = vesicles.filter(v => v.count >= VES_FULL).length;
        const rotSpeed = 2.5 + fullCount * 1.5;
        const diff = revolverRotation - revolverDisplay;
        revolverDisplay += Math.sign(diff) * Math.min(Math.abs(diff), rotSpeed * dt);
    }
    const busyIdx = vesicles.findIndex(v => v.state !== 'barrel');

    for (let i = 0; i < 3; i++) {
        const v = vesicles[i];
        v.t += dt;
        if (v.state === 'barrel') { const p = barrelPos(i, revolverDisplay); v.x = p.x; v.y = p.y; }
        else if (v.state === 'docking') {
            v.x += (DOCK.x - v.x) * 0.12; v.y += (DOCK.y - v.y) * 0.12;
            if (dist(v.x, v.y, DOCK.x, DOCK.y) < 4) { v.state = 'fusing'; v.t = 0; }
        }
        else if (v.state === 'fusing') {
            v.x = DOCK.x; v.y = DOCK.y;
            if (v.t > 0.45) {
                // правка 4d: вероятность квантового выброса (release probability).
                // Неудачное слияние = везикула возвращается, не опорожняясь
                // (физически: standby-состояние active zone, ~50% событий в контроле).
// правка 10: физика квантового выброса. В реальном синапсе при блокаде SERT
// везикулы успевают наполняться (VMAT не ждёт захвата — цитозольный пул
// пополняется синтезом), и каждый Ca2+-триггер даёт полный квант ~4 молекулы.
// Раньше при 92% блокады везикулы приходили на докинг полупустыми (count 1-2),
// и даже редкие события давали мало «топлива» — F1/F3 недобирали до коридора,
// а PI-регулятор выкручивал ручку в насыщение и раскачивал систему.
// Теперь перед слиянием везикула дозаполняется из цитозольного пула:
// сколько реально удалось упаковать — столько и уходит в щель (физично:
// VMAT работает весь межквантовый интервал).
                if (Math.random() < relProb) {
                    // дозаправка везикулы из цитозоля (не больше VES_FULL)
                    let cyto = molecules.filter(mm => mm.state === 'cytosol' && !mm.degradation);
                    while (v.count < VES_FULL && cyto.length > 0) {
                        const pick = cyto.pop();
                        pick.dead = true;
                        v.count++;
                    }
                    const spawnY = CLEFT_TOP + 10;
                    for (let k = 0; k < v.count; k++) {
                        const mm = new Mol(DOCK.x + (Math.random() - 0.5) * 40, spawnY + Math.random() * 12, 'cleft');
                        molecules.push(mm);
                    }
                    // правка 14: масштаб 1->2 — целевой коридор Ф1–Ф3 требует темп ~2.6 мол/с
// (режим «приток==отток» при блокаде SERT 92%); база caInterval+relProb
// дают стабильно ~1.3 мол/с, остальное добирается ПИ-регулятором (gain<=3).
// Визуальный индикатор relHz масштабируется той же константой REL_SCALE.
ringAdd('rel'); ring.rel[ringIdx] += (v.count - 1) * REL_SCALE;
                    secRelAcc += v.count;
                    // правка 5: учёт «доезжающего» притока для регулятора
                    relPending += v.count;
                    v.count = 0;
                }
                v.state = 'returning'; v.t = 0;
            }
        }
        else if (v.state === 'returning') {
            const home = barrelPos(i, revolverDisplay);
            v.x += (home.x - v.x) * 0.12; v.y += (home.y - v.y) * 0.12;
            if (dist(v.x, v.y, home.x, home.y) < 4) { v.state = 'barrel'; v.t = 0; }
        }
    }

    // фикс v9.4h: «защёлка» Ca2+ — событие вооружает активную зону на 1.2 с.
    // Раньше нужна была caActive ровно в кадре проверки: при событии 0.6 с из
    // ~2 с полная везикула редко «застёгивалась» готовой — частота выброса
    // падала вдвое против caInterval.
    if (caActive) caLatchT = 1.2; else caLatchT = Math.max(0, caLatchT - dt);
    if (busyIdx === -1 && !rotating) {
        const activeIdx = activeVesicleIdx(revolverRotation);
        const activeVes = vesicles[activeIdx];
        const delay = (autoRec.active ? 2.0 : 0.3) / activeVes.speed;
        if (activeVes.count >= VES_FULL && activeVes.t > delay && caLatchT > 0) { activeVes.state = 'docking'; activeVes.t = 0; caLatchT = 0; }
        else if (activeVes.count < VES_FULL) {
            const otherFull = vesicles.some((v, idx) => idx !== activeIdx && v.count >= VES_FULL);
            if (otherFull) revolverRotation = (revolverRotation + 1) % 3;
        }
    }

    for (let m of molecules) {
        // фикс v9.4c: trp/htp/kyn/kyna/quin — «конвейерные» молекулы, они НЕ
        // субстрат жизненного цикла цитозоля. Раньше m.life += dt шёл для всех,
        // и через 8 с конвейер убивался (m.dead): синтез останавливался, а
        // synTimer продолжал спавнить Trp в пустоту — уровень щели обваливался
        // до 3-13 вместо коридоров. Теперь life растёт только у цитозольных.
        if (m.state === 'cytosol' || m.state === 'cleft') m.life += dt;
        m.t += dt;

        if (m.state === 'trp') {
            moveToward(m, SYN.branch[0], SYN.branch[1], 80, dt);
            if (dist(m.x, m.y, SYN.branch[0], SYN.branch[1]) < 8) {
                m.state = Math.random() < tdoEff ? 'kyn' : 'htp'; m.t = 0;
                if (m.state === 'kyn') ringAdd('kyn');
            }
        }
        else if (m.state === 'htp') {
            moveToward(m, SYN.ht[0], SYN.ht[1], 80, dt);
            if (dist(m.x, m.y, SYN.ht[0], SYN.ht[1]) < 8) { m.state = 'cytosol'; m.t = 0; m.life = 0; }
        }
        else if (m.state === 'kyn') {
            moveToward(m, KYN_PATH.kyn[0], KYN_PATH.kyn[1], 70, dt);
            if (dist(m.x, m.y, KYN_PATH.kyn[0], KYN_PATH.kyn[1]) < 8) {
                m.state = Math.random() < prm.kynShift ? 'quin' : 'kyna'; m.t = 0;
                if (m.state === 'quin') ringAdd('quin'); else ringAdd('kyna');
            }
        }
        else if (m.state === 'kyna') {
            moveToward(m, KYN_PATH.kyna[0], KYN_PATH.kyna[1], 60, dt);
            if (dist(m.x, m.y, KYN_PATH.kyna[0], KYN_PATH.kyna[1]) < 8) { m.dead = true; }
        }
        else if (m.state === 'quin') {
            moveToward(m, KYN_PATH.quin[0], KYN_PATH.quin[1], 60, dt);
            if (dist(m.x, m.y, KYN_PATH.quin[0], KYN_PATH.quin[1]) < 8) { m.dead = true; }
        }
        else if (m.state === 'cytosol') {
            wander(m, dt, 130);
            // правка 6: мягкие стенки пресинаптического терминаля.
            // Эллипс (PRE_CX,PRE_CY,PRE_RX,PRE_RY) — физическая граница нейрита:
            // раньше молекула «прилипала» к стенке и дёргалась рывками внутрь.
            // Теперь скорость раскладывается на нормаль/касательную к эллипсу:
            // нормальная компонента отражается плавно (пружина + демпфирование),
            // касательная сохраняется — молекула скользит вдоль мембраны, как
            // броуновская частица у стенки (отражение в противоположную сторону
            // без телепортации к центру).
            const wall = 8;                       // толщина пристенечного слоя, px
            const ex = (m.x - PRE_CX) / PRE_RX, ey = (m.y - PRE_CY) / PRE_RY;
            const eNorm = Math.sqrt(ex*ex + ey*ey);   // <1 внутри, =1 на стенке
            if (eNorm > 1 - wall/Math.min(PRE_RX, PRE_RY)) {
                // внешняя нормаль эллипса: градиент (x²/a²+y²/b²)
                let nx = ex / PRE_RX, ny = ey / PRE_RY;
                const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
                if (eNorm > 1) {                  // вышла за стенку — вернуть на границу
                    m.x = PRE_CX + ex / eNorm * PRE_RX;
                    m.y = PRE_CY + ey / eNorm * PRE_RY;
                }
                const vn = m.vx * nx + m.vy * ny; // нормальная компонента скорости
                if (vn > 0) {                     // движется к стенке — отражаем
                    m.vx -= 2 * vn * nx;          // зеркальное отражение
                    m.vy -= 2 * vn * ny;
                    m.vx *= 0.85; m.vy *= 0.85;   // лёгкое демпфирование (упругость мембраны)
                }
                // упругий отпор от стенки (закон Гука в пристенечном слое)
                const push = 40 * Math.max(0, eNorm - (1 - wall/Math.min(PRE_RX, PRE_RY))) / (wall/Math.min(PRE_RX, PRE_RY));
                m.vx -= nx * push * dt * 10;
                m.vy -= ny * push * dt * 10;
            }
            if (m.degradation && !insidePre(m.x, m.y, 10)) { m.x = PRE_CX + ex/Math.max(eNorm,1e-6)*PRE_RX*0.9; m.y = PRE_CY + ey/Math.max(eNorm,1e-6)*PRE_RY*0.9; }
            if (!m.degradation && m.life > 2.0) {
                // фикс v9.4d: MAO-порог был 15, но VMAT физически не может упаковать
                // больше ~3*(VES_FULL-1)=9 молекул в незаполненные везикулы — цитозоль
                // всегда стоял на 10-18 и всё сверх порога сгорало в MAO (mao10=15-20,
                // «сгорание синтеза» вместо накопления). Порог 15 -> 26: деградация по
                // перегрузке включается только при реальном переполнении терминаля;
                // базовый темп 0.15 остаётся (физиологичный оборот 5-HT).
                const overload = Math.max(0, cytosolCount - 26);
                // фикс v9.4g: rate — это ПОТОК деградации (мол/с), а не вероятность
                // на молекулу. Делим на число НЕразлагающихся молекул в цитозоле:
                // раньше каждый стоящий в цитозоле мол получал свою монетку 0.06/с —
                // при пуле 15-20 моль суммарный оборот MAO был 1.5-2.5 мол/с и
                // сжигал весь синтез (mao10=13-25 вместо коридора). Теперь общий
                // темп = (база + перегрузка) независимо от размера пула.
                const nPool = Math.max(1, cytosolCount - degradingCount);
                const rate = (0.06 + 0.05 * overload) * prm.mao / nPool;
                if (Math.random() < rate * dt) m.degradation = true;
            }
            if (m.life > 20.0) { m.dead = true; ringAdd('lost'); continue; }   // фикс v9.4f: лимит жизни цитозоля 8 -> 20 с. Было: молекула, не успевшая упаковаться в везикулу за 8 с, умирала «в никуда» (~1.5 мол/с потерь) — приток к везикулам падал, выброс не дотягивал до коридоров. 20 с = VMAT+диффузия реально успевают упаковать почти всё; MAO-путь (degradation) остаётся основным каналом оборота.
            if (m.degradation) {
                const dx = MAO_POS.x - m.x, dy = MAO_POS.y - m.y, d = dist(m.x, m.y, MAO_POS.x, MAO_POS.y);
                m.vx += dx / d * 500 * dt; m.vy += dy / d * 500 * dt;
                m.trail.push({x: m.x, y: m.y}); if (m.trail.length > 12) m.trail.shift();
                if (d < 45) { m.dead = true; ringAdd('mao'); maoTotal++; hiaaFlashes.push({x: MAO_POS.x, y: MAO_POS.y, t: 0}); MAO_POS.pulse = 1.0; }
                continue;
            }
            // фикс v9.4h: упаковывать только в везикулу со СВОБОДНЫМ МЕСТОМ
            // (count <= VES_FULL-1): прайминг при count<VES_FULL мгновенно делал
            // бочку полной (4/4), все три «застывали» полными, а докинг требовал
            // caActive ровно в кадре — цитозоль рос до 40+, MAO-перегрузка горела,
            // щель голодала. Теперь одна бочка всегда оставляет слот под приём.
            let best = null, bc = VES_FULL + 1, bi = -1;
            for (let i = 0; i < 3; i++) {
                if (vesicles[i].count <= VES_FULL - 1 && vesicles[i].state === 'barrel') {
                    if (vesicles[i].count < bc) { bc = vesicles[i].count; best = vesicles[i]; bi = i; }
                }
            }
            if (best) {
                const pos = barrelPos(bi, revolverDisplay);
                const dx = pos.x - m.x, dy = pos.y - m.y, d = dist(m.x, m.y, pos.x, pos.y) || 1;
                // правка 6b: упаковка только в пределах досягаемости терминаля —
                // раньше притяжение к VMAT растащивало цитозольные молекулы за
                // стенки нейрита; теперь тянем мягко и не выносим за эллипс
                // (стенки отражают сами, см. правку 6 выше).
                if (insidePre(pos.x, pos.y, 30)) {
                    m.vx += dx / d * 180 * dt; m.vy += dy / d * 180 * dt;
                    if (d < 26) { best.count++; m.dead = true; continue; }
                }
            }
        }
        else if (m.state === 'cleft') {
            const step = DIFFUSION_COEFF * Math.sqrt(dt);
            m.x += gaussRandom() * step;
            m.y += gaussRandom() * step;

            if (m.y < CLEFT_TOP + 4) m.y = CLEFT_TOP + 4;
            if (m.y > CLEFT_BOT - 4) m.y = CLEFT_BOT - 4;

            if (m.x < CLEFT_LEFT || m.x > CLEFT_RIGHT) {
                if (Math.random() < EDGE_REFLECT) {
                    m.x = m.x < CLEFT_LEFT ? CLEFT_LEFT + 4 : CLEFT_RIGHT - 4;
                } else { m.dead = true; ringAdd('diff'); continue; }
            }

            let captured = false;
            for (let s of serts) {
                if (!s.blocked && dist(m.x, m.y, s.x, s.y) < s.radius) {
                    ringAdd('up');
                    s.flash = 1.0;
                    m.recycled = true;
                    m.degradation = Math.random() < prm.maoFraction;
                    m.state = 'cytosol'; m.t = 0; m.life = 0;
                    m.x = s.x; m.y = s.y - 40;
                    m.vx = (Math.random() - 0.5) * 40; m.vy = -60;
                    captured = true;
                    break;
                }
            }
            if (captured) continue;

            // фикс v9.5b: рециклированные молекулы, НЕ помеченные на деградацию,
            // возвращаются в щель (экзоситоз транспортера). Раньше они оставались
            // в состоянии 'cytosol' с координатами над щелью и умирали по life>20 —
            // ~1 мол/с синтеза бесследно исчезало, выброс глох до 0.2-0.3 Гц,
            // все фазы недобирали до коридоров (средн. 4-16 при цели 6-28).
            if (m.recycled && !m.degradation) {
                m.state = 'cleft'; m.t = 0; m.life = 0;
                m.x = CLEFT_LEFT + 20 + Math.random() * (CLEFT.w - 40);
                m.y = CLEFT_TOP + 10 + Math.random() * 20;
                continue;
            }

            for (let r of postRecs) {
                // Шаг 5 (ФИКС самод_consistency): чувствительность берётся ОДИН раз
                // из P() по формулам дашборда (ht1a=(0.30-0.10s)(1+0.5adapt),
                // ht2a=(1.0+0.2s)(1-0.15adapt), ht3=(0.8-0.2adapt)). Лишних
                // множителей нет: проверено — ни autoSens, ни хрон-коэффициент,
                // ни «0.5 для 3-го канала» в ветке связывания не применялись;
                // единственное умножение = aff*sens*BIND_RATE*dt (ниже).

                if (dist(m.x, m.y, r.x, r.y) < r.radius) {
                    // v9.0-step1 / шаг 5: диагностика — контакты и связывания,
                    // конверсия окна 300 с сверяется с ожидаемой eff*0.0083
                    if (DIAG.contacts) {
                        diagHit(r, true);
                        if (Math.abs(m.x - DOCK.x) < 60) diagZones.nearDock++; else diagZones.farDock++;
                    }
                    const prob = 1 - Math.exp(-r.aff * sens * BIND_RATE * dt);
                    if (Math.random() < prob) {
                        r.occ = m; r.bindings++;
                        if (DIAG.contacts) diagHit(r, false);
                        if (r.type.startsWith('5-HT2A')) { ringAdd('ev2'); somaticBindSec++; }
                        if (r.type.startsWith('5-HT3')) { ringAdd('ev3'); somaticBindSec++; }
                        if (r.type.startsWith('5-HT1A')) ringAdd('ev1');

                        r.flash = 1.0;
                        receptorFlashes.push({x: r.x, y: r.y - 10, color: r.color, t: 0});

                    }
                }
            }

            // ===== МОДУЛЬ A: ветка связывания 2C (аддитивно, после старых) =====
            // Конкурирует ТОЛЬКО за молекулы, не связанные с 1A/2A/3/SERT/auto.
            // Слот один (как у постсинаптики). Не влияет на ev1/ev2/ev3.

                    diagHit(rec2c, true);
                    if (Math.abs(m.x - DOCK.x) < 60) diagZones.nearDock++; else diagZones.farDock++;
                }
                const prob2c = 1 - Math.exp(-rec2c.aff * getSens2c() * BIND_RATE * dt);
                if (Math.random() < prob2c) {

            // Раньше он срабатывал и при пустой щели и ставил паузу 2+3c почти без
            // перерыва — самоподдерживающийся голод выброса. Порог «выше центра»
            // тоже не годился: центр ниже верхней границы коридора, и торможение
            // включалось ещё ДО входа в норму. Теперь пауза возможна только когда
            // сглаженный уровень >= нижней границы целевого коридора фазы.
            const overTarget = (occEma !== null && occEma >= normRange()[0]);

                // Старое условие бросало монетку autoSens*1.2 КАЖДЫЙ кадр, пока
                // молекула в радиусе: при 60 fps это ~78% шанс за 0.1 c, и цепочка
                // «занять(2c)+пауза(3c)' шла почти без перерыва — выброс глох
                // (жалоба: «ауторецептор тупо блокирует везикулы»). Теперь
                // вероятность привязана к dt как у постсинаптики: p=1-exp(-k*dt).
                const kAuto = prm.autoSens * 0.5;   // средн. ожидание ~1 событие/2-4 c при тревоге
                if (Math.random() < 1 - Math.exp(-kAuto * dt)) { autoRec.occupied = m; m.state = 'auto'; m.t = 0; }
            }

            // правка 1b: буфер ёмкости щели — при превышении CLEFT_MAX_POP
            // самые старые свободные молекулы уходят периферическую диффузией
            // (физически: выход из активационной зоны в объём вне щели)
        }

            if (m.t > 0.5 + 0.5 / m.target.aff) {   // правка 13a
                m.target.occ = null;
                m.state = 'cleft';
                m.t = 0;
            }
        }
        else if (m.state === 'auto') {
            if (m.t > 2.0) { autoRec.occupied = null; autoRec.active = true; autoRec.activeT = 3.0 * prm.autoSens; m.dead = true; }
        }
    }
    // правка 1b (реализация): буфер ёмкости щели. Если свободных молекул больше
    // CLEFT_MAX_POP, самые старые вытесняются периферической диффузией.
    {
        const frees = molecules.filter(m => m.state === 'cleft');
        if (frees.length > CLEFT_MAX_POP) {
            frees.sort((a, b) => a.life - b.life);
            for (let i = 0; i < frees.length - CLEFT_MAX_POP; i++) {
                frees[i].dead = true; ringAdd('diff');
            }
        }
    }
    molecules = molecules.filter(m => !m.dead);

    for (let s of serts) { if (s.flash > 0) s.flash -= dt * 3; }

    if (autoRec.active) {

    hiaaFlashes = hiaaFlashes.filter(f => f.t < 1.5);
    for (let f of receptorFlashes) f.t += dt;
    receptorFlashes = receptorFlashes.filter(f => f.t < 0.8);
    for (let e of calciumEvents) e.t += dt;
    calciumEvents = calciumEvents.filter(e => e.t < 0.8);
    if (MAO_POS.pulse > 0) MAO_POS.pulse -= dt * 2;
}

function lerpColor(c1, c2, t) {
    const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
    const a = p(c1), b = p(c2);
    const r = a.map((v,i) => Math.round(v + (b[i]-v)*t));
    return `rgb(${r[0]},${r[1]},${r[2]})`;
}

    if (stressLevel < 0.3) { status = 'СПОКОЙСТВИЕ (терапия успешна)'; statusColor = '#008844'; }
    else if (stressLevel < 0.7) { status = 'ПЕРЕХОД / ЧАСТИЧНАЯ РЕМИССИЯ'; statusColor = '#cc8800'; }
    else { status = 'ХРОНИЧЕСКИЙ СТРЕСС / ДИСБАЛАНС'; statusColor = '#cc2222'; }
    ctx.fillStyle = '#000'; ctx.font = 'bold 14px Courier New';
    ctx.fillText('ДАШБОРД · ' + status, x + 12, y + 24);
    const relWin = ringSum('rel'), upWin = ringSum('up'), synWin = ringSum('syn'), maoWin = ringSum('mao');
    const kynWin = ringSum('kyn'), kynaWin = ringSum('kyna'), quinWin = ringSum('quin');
    const diffWin = ringSum('diff'), lostWin = ringSum('lost');
    const ev2Win = ringSum('ev2'), ev3Win = ringSum('ev3'), ev1Win = ringSum('ev1');
    const cleftN = molecules.filter(m => m.state === 'cleft').length;
    const range = normRange();
    const inRange = cleftN >= range[0] && cleftN <= range[1];
    const cleftColor = inRange ? '#008844' : '#cc8800';
    const evTotal = postRecs[0].bindings + postRecs[1].bindings + postRecs[2].bindings;
    const relHz = (relWin / 10 / REL_SCALE).toFixed(1);   // правка 14: обратно в мол/с
    const upHz = (upWin / 10).toFixed(1);
    ctx.font = '11px Courier New';
    let lines = [   // фикс v9.4b: был const — строка 1302 (lines = lines.concat) кидала TypeError, цикл loop падал каждый кадр и симуляция не запускалась вообще
        ['Время: ' + simTime.toFixed(1) + ' c', '#00aa00'],
        ['Выброс: ' + relWin + ' (' + relHz + ' Гц)', '#008877'],
        ['Захват SERT: ' + upWin + ' (' + upHz + ' Гц)', '#5566cc'],
        ['MAO окно: ' + maoWin + ' | сессия: ' + maoTotal, '#cc4444'],
        ['Синтез 5-HT: ' + synWin, '#886622'],
        ['KYN: ' + kynWin + ' (KYNA=' + kynaWin + ' QUIN=' + quinWin + ')', '#7744cc'],
        ['Диффузия: ' + diffWin + ' / Потеряно: ' + lostWin, '#999999'],
        ['5-HT в щели: ' + cleftN + ' (~' + (cleftN * NM_PER_MOL) + ' нМ)', cleftColor],
        ['  норма фазы: ' + (range[0]*NM_PER_MOL) + '-' + (range[1]*NM_PER_MOL) + ' нМ', cleftColor],
        ['--- СИГНАЛИЗАЦИЯ (сессия) ---', '#000000'],
        ['≥1 связь: ' + signaledTotal, '#cc2277'],
        ['1A=' + postRecs[0].bindings + ' 2A=' + postRecs[1].bindings + ' 3=' + postRecs[2].bindings, '#4488ff'],
        ['Распр: ' + (evTotal ? Math.round(postRecs[0].bindings/evTotal*100) : 0) + '/' + (evTotal ? Math.round(postRecs[1].bindings/evTotal*100) : 0) + '/' + (evTotal ? Math.round(postRecs[2].bindings/evTotal*100) : 0), '#4488ff'],
        ['2A+3/10с: ' + (ev2Win + ev3Win) + ' (нагрузка/побочки)', '#ff8844'],
        ['2C/10с: ' + ringSum('ev2c') + ' (n=' + rec2c.bindings + ', чув x' + getSens2c().toFixed(2) + ')', '#aa55dd'],
        ['--- ТЕРАПИЯ ---', '#000000'],
        ['Фаза: ' + THERAPY_PHASES[targetPhase].name, '#b8860b'],
        ['Блок SERT: ' + Math.round(therapy.block * 100) + '%', '#b8860b'],
        ['Десенс авто: ' + Math.round(therapy.desens * 100) + '% | Постадапт: ' + Math.round(therapy.adapt * 100) + '%', '#b8860b'],
        ['--- РЕГУЛЯЦИЯ ---', '#000000'],
        ['Уровень тревоги: ' + Math.round(stressLevel * 100) + '%', '#cc2222'],
        ['Кортизол: ' + Math.round(prm.cortisol * 100) + '%', '#cc9900'],
        ['TDO: ' + Math.round(tdoEff * 100) + '% (ramp ' + Math.round(tdoRamp * 100) + '%)', '#7744cc'],
    ];
    // v9.4: метрика «Тревога тела (соматика)» — ДОБАВЛЯЕТСЯ строкой, старые не тронуты
    if (MODULES.somatic_v2) {
        const soma = somaticScore(prm);
        lines.push(['Тревога тела (соматика): ' + soma.toFixed(1) + '/10', soma >= 5 ? '#cc2222' : (soma >= 3 ? '#cc8800' : '#008844')]);
    }
    // Модуль A: метрики 2C — ДОБАВЛЯЮТСЯ строками, старые не тронуты
    if (MODULES.ht2c) {
        ev2cWin = ringSum('ev2c');
        lines.push(['2C-нагрузка/10с: ' + ev2cWin + ' | чув: x' + getSens2c().toFixed(2), '#aa55dd']);
    }
    // v9.1: метрика истощения синтеза — ДОБАВЛЯЕТСЯ, старые строки не тронуты
    if (MODULES.tph2_exhaustion) {
        lines.push(['Истощение Tph2: ' + Math.round(exhaustion * 100) + '% (synth x' + (1 - 0.35*exhaustion).toFixed(2) + ')', '#886622']);
    }
    lines = lines.concat([
        ['MAO: ' + Math.round(prm.mao * 100) + '% | 1Aчув: ' + Math.round(prm.ht1a * 100) + '%', '#cc4444'],
        ['2Aчув: ' + Math.round(prm.ht2a * 100) + '% | 3чув: ' + Math.round(prm.ht3 * 100) + '%', '#4488ff'],
        // правка 12: срез распределения сигнальных событий за 10 с — при хрон.
        // тревоге ожидается перекос в сторону 2A/3 («возбуждение»), при Ф3 — к 1A.
        ['События 10с 1A/2A/3: ' + ev1Win + '/' + ev2Win + '/' + ev3Win, '#4488ff'],
    ]);
    // v9.0-step1: строки диагностики (ДОБАВЛЯЮТСЯ, старые не тронуты)
    if (DIAG.contacts) {
        for (let r of postRecs) {
            const wc = r.dC.length, wb = r.dB.length;
            lines.push(['ДИАГ ' + r.type.slice(5) + ': конт=' + r.diagContacts + ' связ=' + r.diagBindOk +
                ' | окно ' + DIAG_WIN + 'с: ' + wb + '/' + wc + '=' + (wc ? (wb/wc*100).toFixed(2) : '0') + '% (ожид ' + diagExpected(r).toFixed(2) + '%)', '#888888']);
        }
    }
    // v9.5-T (аддитивная телеметрия для внешнего регресс-тестера): состояния пулов,
    // ручка ПИ, задержка докинга. Чистовная строка, динамику не трогает.
    {
        let st = {}; for (let m of molecules) st[m.state] = (st[m.state]||0)+1;
        const av = vesicles[activeVesicleIdx(revolverRotation)];
        const emaS = (occEma === null ? '-' : occEma.toFixed(1));
        lines.push(['T [cyt=' + (st.cytosol||0) + '|cleft=' + (st.cleft||0) + '|bound=' + (st.bound||0) +
            '|auto=' + (st.auto||0) + '|htp=' + (st.htp||0) + '|gain=' + lastOccGain.toFixed(2) +
            '|ema=' + emaS + '|tgt=' + targetCenter().toFixed(1) +
            '|I=' + occInteg.toFixed(2) + '|pend=' + relPending.toFixed(1) +
            '|busy=' + (vesicles.some(v=>v.state!=='barrel')?1:0) +
            '|actCnt=' + av.count + '|actSt=' + av.state + '|actT=' + av.t.toFixed(2) +
            '|delay=' + ((autoRec.active?2.0:0.3)/av.speed).toFixed(2) +
            '|latch=' + caLatchT.toFixed(2) + '|caAct=' + (calciumEvents.some(e=>e.active&&e.t<e.duration)?1:0) +
            '|relP=' + relProb.toFixed(2) + '|rot=' + revolverRotation + '|' + revolverDisplay.toFixed(2) +
            '|exh=' + exhaustion.toFixed(2) + ']', '#666666']);
    }
    lines.push(['Барабан: ' + vesicles.map(v => v.count).join(','), '#886622']);
    lines.push(['(окно 10с; 1 мол ≈ 2 нМ)', '#888888']);
    let yy = y + 46;
    for (let L of lines) { ctx.fillStyle = L[1]; ctx.fillText(L[0], x + 12, yy); yy += 18; }
    ctx.fillStyle = statusColor; ctx.font = 'bold 14px Courier New';
    ctx.fillText('СТАТУС: ' + status, x + 12, y + h - 14);
}
function drawTooltip() {
    // правка 16: ранний выход по mouse.x>870 убирал подсказки на всей правой
    // трети канваса; теперь тултип просто отражается от правого края.
    let hit = null;
    for (let t of tooltips) { if (dist(mouse.x, mouse.y, t.x, t.y) < t.r) { hit = t; break; } }
    if (!hit) return;
    const maxLen = Math.max(hit.title.length, ...hit.lines.map(l => l.length));
    const bw = maxLen * 7 + 20, bh = hit.lines.length * 14 + 30;
    let bx = mouse.x + 15, by = mouse.y + 15;
    if (bx + bw > W - 5) bx = mouse.x - bw - 15;
    if (by + bh > H - 5) by = mouse.y - bh - 15;
    ctx.fillStyle = 'rgba(255,255,240,0.97)'; ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.fillRect(bx, by, bw, bh); ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = '#000'; ctx.font = 'bold 12px Courier New';
    ctx.fillText(hit.title, bx + 10, by + 18);
    ctx.font = '11px Courier New';
    let yy = by + 34;
    for (let l of hit.lines) { ctx.fillText(l, bx + 10, yy); yy += 14; }
}

let last = performance.now();
function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt); draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
