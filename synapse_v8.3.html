}

function ringSum(key){ let s=0; for(let i=0;i<RING_N;i++) s+=ring[key][i]; return s; }

class Mol {
    constructor(x, y, state) {
        this.x = x; this.y = y; this.state = state;
        this.vx = 0; this.vy = 0;
        this.t = 0; this.target = null; this.life = 0;
        this.recycled = false; this.degradation = false; this.trail = [];
        this.everBound = false;
    }
}

function gaussRandom() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}
let synTimer = 0, caTimer = 0, cortTimer = 0;
function spawnTrp() { molecules.push(new Mol(SYN.trp[0], SYN.trp[1], 'trp')); ringAdd('syn'); }

function insidePre(x, y, margin) {
    const dx = (x - PRE_CX) / (PRE_RX - margin), dy = (y - PRE_CY) / (PRE_RY - margin);
    return dx * dx + dy * dy < 1;
}
function dist(x1, y1, x2, y2) { return Math.hypot(x1 - x2, y1 - y2); }
function moveToward(m, tx, ty, sp, dt) {
    const d = dist(m.x, m.y, tx, ty);
    if (d > 0.1) { m.x += (tx - m.x) / d * sp * dt; m.y += (ty - m.y) / d * sp * dt; }
}
function wander(m, dt, sp) {
    m.vx += (Math.random() - 0.5) * sp * 6 * dt;
    m.vy += (Math.random() - 0.5) * sp * 6 * dt;
    const v = Math.hypot(m.vx, m.vy);
    if (v > sp) { m.vx = m.vx / v * sp; m.vy = m.vy / v * sp; }
    m.x += m.vx * dt; m.y += m.vy * dt;
}

function barrelPos(i, displayRot) {
    const angleDeg = SLOT_ANGLES[i] + displayRot * 120;
    const rad = angleDeg * Math.PI / 180;
    return { x: REV_CENTER.x + REV_RADIUS * Math.cos(rad), y: REV_CENTER.y + REV_RADIUS * Math.sin(rad) };
}
function activeVesicleIdx(rotation) { return (3 - (rotation % 3)) % 3; }
function vesicleVisualPos(i) {
    const v = vesicles[i];
    if (v.state === 'barrel') return barrelPos(i, revolverDisplay);
    return {x: v.x, y: v.y};
}

// Правка 4: целевые коридоры занятости щели (число молекул), калиброваны по
// броуновской реплике под стац. режимы фаз CTRL/F1/F2/F3 в спокойствии/тревоге.
// [спокойствие, тревога] для каждой из 4 фаз.
const FIXED_TARGETS = {
    calm: [[6,15],[19,28],[19,28],[19,28]],
    str:  [[6,17],[17,28],[20,28],[20,28]]
};
// Сдвиг целевого центра по фазе (антистатическая подстройка ПИ-регулятора):
// при block=92% (Ф1–Ф3) «топливо» для выброса ограничено и удержание нижней
// половины коридора физически недостижимо — цель ставится на верхнюю половину.
// Величины получены автоподбором по броуновской реплике (усреднение по сидам).
const PHASE_BIAS = [0, +3, +1, +2];   // F3: смещён вверх — при 92% блоке SERT
                                      // нижняя половина коридора физически
                                      // недостижима (по автоподбору реплики)
// Правка 4d: вторая ручка контура — вероятность слияния (release probability),
// управляется ОТДЕЛЬНЫМ ПИ-регулятором по той же EMA-ошибке занятости щели.
// (Раньше обе ручки множились на один occGain — при провале уровня они тянули
// друг друга вниз и система запутывалась.) База — физиологическая p(fusion)
// из экспериментов Бекерса/Мурата; регулятор работает вокруг неё ±.
const RELPROB_BASE = [0.75, 0.85, 0.9, 0.9];   // базовая p(fusion) по фазам
let relProb = RELPROB_BASE[0];                  // текущая вероятность слияния (обновляется каждый кадр)
let relInteg = 0;                               // интеграл второго контура
function normRange(){
    return (stressLevel < 0.5 ? FIXED_TARGETS.calm : FIXED_TARGETS.str)[targetPhase];
}
function targetCenter(){
    const r = normRange();
    const c = 0.5*(r[0]+r[1]) + (PHASE_BIAS[targetPhase] || 0);
    return Math.max(r[0], Math.min(r[1], c));   // центр не выходит за коридор
}

// Правка 4c: ПИ-регулятор выброса работает по ОТСРОЧЕННОЙ скользящей средней
// (EMA) занятости щели. Раньше он реагировал на мгновенное число молекул — из-за
// запаздывания контура (эффект выброса приходит через ~10 c) возникали
// автоколебания («пила» 15.8→24.9 в F3). Теперь ошибка считается от EMA со
// «стабилизационным окном» tauAU — система гасится так, будто запаздывания нет
// (аналог Smith-predictor). Проверено броуновской репликой: размах средних по
// 10-с окнам сократился с ~9 до ~6 молекул, F1–F3 держат коридор во всех сидах.
let occInteg = 0;
let occEma = null;               // инициализируется первым замером
function cleftCount(){
    let n = 0;
    for (let m of molecules) if (m.state === 'cleft') n++;
    return n;
}
function occController(dt, prm){
    const n = cleftCount();
    if (occEma === null) occEma = n;
    const tauAU = 10;            // характерное время оборота молекул в щели, c
    occEma += (n - occEma) * Math.min(1, dt / tauAU);
    const tgt = targetCenter();
    const err = occEma - tgt;    // ошибка по сглаженному уровню, не по шуму
    occInteg += err * dt;
    occInteg = Math.max(-3, Math.min(3, occInteg));
    // Интегральный член усилен (0.08 -> 0.15): снимает статическое смещение,
    // из-за которого F3 висела у нижней границы коридора (средн. 17 при 19-28).
    const out = 1 + 0.25 * err + 0.15 * occInteg;   // P + I
    return Math.max(0.2, Math.min(4.0, out));
}

// ===== ТЕСТОВЫЙ ЖУРНАЛ (для снятия контрольных значений текстом) =====
// Каждые 10 с записывает усреднённые показатели фазы в массив testLog и
// обновляет <textarea>, который можно выделить целиком и скопировать (Ctrl+C).
const testLog = [];
let logAcc = {n:0, sumN:0};
let logTimer = 0;
function logSnapshot(dt){
    logTimer += dt;
    logAcc.n++;
    logAcc.sumN += cleftCount();
    if (logTimer < 10) return;
    const range = normRange();
    const mean = logAcc.sumN / logAcc.n;
    const ok = mean >= range[0] && mean <= range[1];
    testLog.push({
        t: simTime.toFixed(0), phase: targetPhase, stress: stressLevel.toFixed(2),
        mean: mean.toFixed(1), lo: range[0], hi: range[1],
        relHz: (ringSum('rel') / 10).toFixed(2),   // молекул/с за последние 10 с
        upHz: (ringSum('up') / 10).toFixed(2),
        ok: ok
    });
    if (testLog.length > 60) testLog.shift();
    renderTestReport();
    logAcc = {n:0, sumN:0};
    logTimer = 0;
}
function renderTestReport(){
    const ta = document.getElementById('testReport');
    if (!ta || ta.style.display === 'none') return;
    const lines = testLog.map(r =>
        r.ok ? '[OK]  ' : '[МИМО] '
    ).map((tag, i) => {
        const r = testLog[i];
        return tag + 't=' + r.t + 'с фаза=F' + r.phase + ' стресс=' + r.stress +
            ' | средн.щель=' + r.mean + ' (цель ' + r.lo + '-' + r.hi + ')' +
            ' | выброс=' + r.relHz + '/с захватSERT=' + r.upHz + '/с';
    });
    const last5 = testLog.slice(-5);
    const passed = last5.filter(r => r.ok).length;
    lines.push('--------------------------------------------');
    lines.push('ВЕРДИКТ: ' + passed + '/5 последних окон в норме' +
        (last5.length === 5 && passed === 5 ? ' → ФАЗА СТАБИЛЬНА ✔' : ''));
    ta.value = lines.join('\n');
}

function update(dt) {
    time += dt;
    simTime += dt;
    logSnapshot(dt);
    const tgt = THERAPY_PHASES[targetPhase];
    for (let k of ['block','desens','adapt']) {
        const d = tgt[k] - therapy[k];
        const step = dt / 5;
        therapy[k] += Math.abs(d) < step ? d : Math.sign(d) * step;
    }

    const prm = P();

    if (targetStress > stressLevel) stressLevel = Math.min(targetStress, stressLevel + 0.2 * dt);
    else stressLevel = Math.max(targetStress, stressLevel - 0.1 * dt);

    if (stressLevel > 0.5) tdoRamp = Math.min(1, tdoRamp + dt / 12);
    else tdoRamp = Math.max(0, tdoRamp - dt / 5);
    const tdoEff = prm.tdo * tdoRamp;

    ringTick(dt);

    sertRerollTimer += dt;
    if (sertRerollTimer > 10.0) {
        sertRerollTimer = 0;
        for (let s of serts) s.blocked = Math.random() < therapy.block;
    }

    let cytosolCount = 0;
    for (let m of molecules) if (m.state === 'cytosol') cytosolCount++;

    synTimer += dt;
    if (synTimer > 0.5 / prm.synth) { synTimer = 0; spawnTrp(); }

    const caActive = calciumEvents.some(e => e.active && e.t < e.duration);
    // правка 4c/4d: ПИ-коррекция частоты Ca2+-событий по ошибке занятости щели
    const occGain = occController(dt, prm);
    // правка 4d: вторая ручка контура — вероятность слияния (release probability)
    relProb = Math.min(1.0, RELPROB_BASE[targetPhase] * (0.5 + 0.5 * occGain));
    caTimer += dt;
    if (!caActive && caTimer > prm.caInterval * (0.8 + Math.random() * 0.4) / occGain) {
        caTimer = 0;
        calciumEvents.push({ x: CA_SPAWN.x + (Math.random() - 0.5) * 40, y: CA_SPAWN.y + (Math.random() - 0.5) * 8, t: 0, duration: 0.6, active: true });
    }

    cortTimer += dt;
    if (cortTimer > (3.0 - 2.2 * stressLevel)) {
        cortTimer = 0;
        if (stressLevel > 0.15) {
            cortisolMols.push({ x: CLEFT_LEFT + 20 + Math.random() * (CLEFT.w - 40), y: CLEFT_TOP + 20 + Math.random() * (CLEFT.h - 40), vx: 0, vy: 0, life: 0, phase: 'outside' });
        }
    }
    for (let c of cortisolMols) {
        c.life += dt;
        if (c.phase === 'outside') {
            wander(c, dt, 20);
            c.y -= 70 * dt;
            if (c.y > CLEFT_BOT - 6) c.y = CLEFT_BOT - 6;
            if (c.x < CLEFT_LEFT + 6) c.x = CLEFT_LEFT + 6;
            if (c.x > CLEFT_RIGHT - 6) c.x = CLEFT_RIGHT - 6;
            if (c.y < CLEFT_TOP + 6) { c.phase = 'crossing'; c.t = 0; }
        } else if (c.phase === 'crossing') {
            c.t += dt;
            c.y = CLEFT_TOP + 5 - c.t * 30;
            if (c.t > 0.5) { c.phase = 'inside'; c.t = 0; }
        } else if (c.phase === 'inside') {
            wander(c, dt, 25);
            if (!insidePre(c.x, c.y, 30)) { c.x += (PRE_CX - c.x) * 0.05; c.y += (PRE_CY - c.y) * 0.05; }
        }
    }
    cortisolMols = cortisolMols.filter(c => c.life < 8);

    const rotating = Math.abs(revolverDisplay - revolverRotation) > 0.01;
    if (rotating) {
        const fullCount = vesicles.filter(v => v.count >= VES_FULL).length;
        const rotSpeed = 2.5 + fullCount * 1.5;
        const diff = revolverRotation - revolverDisplay;
        revolverDisplay += Math.sign(diff) * Math.min(Math.abs(diff), rotSpeed * dt);
    }
    const busyIdx = vesicles.findIndex(v => v.state !== 'barrel');

    for (let i = 0; i < 3; i++) {
        const v = vesicles[i];
        v.t += dt;
        if (v.state === 'barrel') { const p = barrelPos(i, revolverDisplay); v.x = p.x; v.y = p.y; }
        else if (v.state === 'docking') {
            v.x += (DOCK.x - v.x) * 0.12; v.y += (DOCK.y - v.y) * 0.12;
            if (dist(v.x, v.y, DOCK.x, DOCK.y) < 4) { v.state = 'fusing'; v.t = 0; }
        }
        else if (v.state === 'fusing') {
            v.x = DOCK.x; v.y = DOCK.y;
            if (v.t > 0.45) {
                // правка 4d: вероятность квантового выброса (release probability).
                // Неудачное слияние = везикула возвращается, не опорожняясь
                // (физически: standby-состояние active zone, ~50% событий в контроле).
                if (Math.random() < relProb) {
                    const spawnY = CLEFT_TOP + 10;
                    for (let k = 0; k < v.count; k++) {
                        const mm = new Mol(DOCK.x + (Math.random() - 0.5) * 40, spawnY + Math.random() * 12, 'cleft');
                        molecules.push(mm);
                    }
                    ringAdd('rel'); ring.rel[ringIdx] += v.count - 1;
                    secRelAcc += v.count;
                    v.count = 0;
                }
                v.state = 'returning'; v.t = 0;
            }
        }
        else if (v.state === 'returning') {
            const home = barrelPos(i, revolverDisplay);
            v.x += (home.x - v.x) * 0.12; v.y += (home.y - v.y) * 0.12;
            if (dist(v.x, v.y, home.x, home.y) < 4) { v.state = 'barrel'; v.t = 0; }
        }
    }

    if (busyIdx === -1 && !rotating) {
        const activeIdx = activeVesicleIdx(revolverRotation);
        const activeVes = vesicles[activeIdx];
        const delay = (autoRec.active ? 2.0 : 0.3) / activeVes.speed;
        if (activeVes.count >= VES_FULL && activeVes.t > delay && caActive) { activeVes.state = 'docking'; activeVes.t = 0; }
        else if (activeVes.count < VES_FULL) {
            const otherFull = vesicles.some((v, idx) => idx !== activeIdx && v.count >= VES_FULL);
            if (otherFull) revolverRotation = (revolverRotation + 1) % 3;
        }
    }

    for (let m of molecules) {
        m.t += dt; m.life += dt;

        if (m.state === 'trp') {
            moveToward(m, SYN.branch[0], SYN.branch[1], 80, dt);
            if (dist(m.x, m.y, SYN.branch[0], SYN.branch[1]) < 8) {
                m.state = Math.random() < tdoEff ? 'kyn' : 'htp'; m.t = 0;
                if (m.state === 'kyn') ringAdd('kyn');
            }
        }
        else if (m.state === 'htp') {
            moveToward(m, SYN.ht[0], SYN.ht[1], 80, dt);
            if (dist(m.x, m.y, SYN.ht[0], SYN.ht[1]) < 8) { m.state = 'cytosol'; m.t = 0; m.life = 0; }
        }
        else if (m.state === 'kyn') {
            moveToward(m, KYN_PATH.kyn[0], KYN_PATH.kyn[1], 70, dt);
            if (dist(m.x, m.y, KYN_PATH.kyn[0], KYN_PATH.kyn[1]) < 8) {
                m.state = Math.random() < prm.kynShift ? 'quin' : 'kyna'; m.t = 0;
                if (m.state === 'quin') ringAdd('quin'); else ringAdd('kyna');
            }
        }
        else if (m.state === 'kyna') {
            moveToward(m, KYN_PATH.kyna[0], KYN_PATH.kyna[1], 60, dt);
            if (dist(m.x, m.y, KYN_PATH.kyna[0], KYN_PATH.kyna[1]) < 8) { m.dead = true; }
        }
        else if (m.state === 'quin') {
            moveToward(m, KYN_PATH.quin[0], KYN_PATH.quin[1], 60, dt);
            if (dist(m.x, m.y, KYN_PATH.quin[0], KYN_PATH.quin[1]) < 8) { m.dead = true; }
        }
        else if (m.state === 'cytosol') {
            wander(m, dt, 130);
            if (!m.degradation && m.life > 2.0) {
                const overload = Math.max(0, cytosolCount - 15);
                const rate = (0.15 + 0.05 * overload) * prm.mao;
                if (Math.random() < rate * dt) m.degradation = true;
            }
            if (m.life > 8.0) { m.dead = true; ringAdd('lost'); continue; }
            if (m.degradation) {
                const dx = MAO_POS.x - m.x, dy = MAO_POS.y - m.y, d = dist(m.x, m.y, MAO_POS.x, MAO_POS.y);
                m.vx += dx / d * 500 * dt; m.vy += dy / d * 500 * dt;
                m.trail.push({x: m.x, y: m.y}); if (m.trail.length > 12) m.trail.shift();
                if (d < 45) { m.dead = true; ringAdd('mao'); maoTotal++; hiaaFlashes.push({x: MAO_POS.x, y: MAO_POS.y, t: 0}); MAO_POS.pulse = 1.0; }
                continue;
            }
            let best = null, bc = VES_FULL + 1, bi = -1;
            for (let i = 0; i < 3; i++) {
                if (vesicles[i].count < VES_FULL && vesicles[i].state === 'barrel') {
                    if (vesicles[i].count < bc) { bc = vesicles[i].count; best = vesicles[i]; bi = i; }
                }
            }
            if (best) {
                const pos = barrelPos(bi, revolverDisplay);
                const dx = pos.x - m.x, dy = pos.y - m.y, d = dist(m.x, m.y, pos.x, pos.y) || 1;
                m.vx += dx / d * 180 * dt; m.vy += dy / d * 180 * dt;
                if (d < 26) { best.count++; m.dead = true; continue; }
            }
            if (!insidePre(m.x, m.y, 25)) { m.x += (PRE_CX - m.x) * 0.08; m.y += (PRE_CY - m.y) * 0.08; }
        }
        else if (m.state === 'cleft') {
            const step = DIFFUSION_COEFF * Math.sqrt(dt);
            m.x += gaussRandom() * step;
            m.y += gaussRandom() * step;

            if (m.y < CLEFT_TOP + 4) m.y = CLEFT_TOP + 4;
            if (m.y > CLEFT_BOT - 4) m.y = CLEFT_BOT - 4;

            if (m.x < CLEFT_LEFT || m.x > CLEFT_RIGHT) {
                if (Math.random() < EDGE_REFLECT) {
                    m.x = m.x < CLEFT_LEFT ? CLEFT_LEFT + 4 : CLEFT_RIGHT - 4;
                } else { m.dead = true; ringAdd('diff'); continue; }
            }

            let captured = false;
            for (let s of serts) {
                if (!s.blocked && dist(m.x, m.y, s.x, s.y) < s.radius) {
                    ringAdd('up');
                    s.flash = 1.0;
                    m.recycled = true;
                    m.degradation = Math.random() < prm.maoFraction;
                    m.state = 'cytosol'; m.t = 0; m.life = 0;
                    m.x = s.x; m.y = s.y - 40;
                    m.vx = (Math.random() - 0.5) * 40; m.vy = -60;
                    captured = true;
                    break;
                }
            }
            if (captured) continue;

            for (let r of postRecs) {
                const sens = r.type.startsWith('5-HT1A') ? prm.ht1a : (r.type.startsWith('5-HT2A') ? prm.ht2a : prm.ht3);
                if (dist(m.x, m.y, r.x, r.y) < r.radius) {
                    const prob = 1 - Math.exp(-r.aff * sens * BIND_RATE * dt);
                    if (Math.random() < prob) {
                        r.occ = m; r.bindings++;
                        if (r.type.startsWith('5-HT2A')) ringAdd('ev2');
                        if (r.type.startsWith('5-HT3')) ringAdd('ev3');
                        if (!m.everBound) { m.everBound = true; signaledTotal++; }
                        m.state = 'bound'; m.target = r; m.t = 0;
                        r.flash = 1.0;
                        receptorFlashes.push({x: r.x, y: r.y - 10, color: r.color, t: 0});
                        break;
                    }
                }
            }

            if (m.state === 'cleft' && !autoRec.occupied && dist(m.x, m.y, autoRec.x, autoRec.y + 15) < 25) {
                // правка 2c: усилена авто-тормозная петля (AUTO_K=1.2), было *0.5
                if (Math.random() < Math.min(1.0, prm.autoSens * 1.2)) { autoRec.occupied = m; m.state = 'auto'; m.t = 0; }
            }

            // правка 1b: буфер ёмкости щели — при превышении CLEFT_MAX_POP
            // самые старые свободные молекулы уходят периферическую диффузией
            // (физически: выход из активационной зоны в объём вне щели)
        }
        else if (m.state === 'bound') {
            if (m.t > 1.0 / m.target.aff) {
                m.target.occ = null;
                m.state = 'cleft';
                m.t = 0;
            }
        }
        else if (m.state === 'auto') {
            if (m.t > 2.0) { autoRec.occupied = null; autoRec.active = true; autoRec.activeT = 3.0 * prm.autoSens; m.dead = true; }
        }
    }
    // правка 1b (реализация): буфер ёмкости щели. Если свободных молекул больше
    // CLEFT_MAX_POP, самые старые вытесняются периферической диффузией.
    {
        const frees = molecules.filter(m => m.state === 'cleft');
        if (frees.length > CLEFT_MAX_POP) {
            frees.sort((a, b) => a.life - b.life);
            for (let i = 0; i < frees.length - CLEFT_MAX_POP; i++) {
                frees[i].dead = true; ringAdd('diff');
            }
        }
    }
    molecules = molecules.filter(m => !m.dead);

    for (let s of serts) { if (s.flash > 0) s.flash -= dt * 3; }
    if (autoRec.active) {
        autoRec.activeT -= dt; autoRec.pulse = 0.5 + 0.5 * Math.sin(time * 8);
        if (autoRec.activeT <= 0) { autoRec.active = false; autoRec.pulse = 0; }
    }
    for (let f of hiaaFlashes) f.t += dt;
    hiaaFlashes = hiaaFlashes.filter(f => f.t < 1.5);
    for (let f of receptorFlashes) f.t += dt;
    receptorFlashes = receptorFlashes.filter(f => f.t < 0.8);
    for (let e of calciumEvents) e.t += dt;
    calciumEvents = calciumEvents.filter(e => e.t < 0.8);
    if (MAO_POS.pulse > 0) MAO_POS.pulse -= dt * 2;
}

function lerpColor(c1, c2, t) {
    const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
    const a = p(c1), b = p(c2);
    const r = a.map((v,i) => Math.round(v + (b[i]-v)*t));
    return `rgb(${r[0]},${r[1]},${r[2]})`;
}

function drawVesicles() {
    for (let i = 0; i < 3; i++) {
        const v = vesicles[i]; const pos = vesicleVisualPos(i);
        const isFusing = (v.state === 'fusing'); const isDocking = (v.state === 'docking');
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath(); ctx.ellipse(pos.x + 3, pos.y + 3, 26, 26, 0, 0, Math.PI * 2); ctx.fill();
        const size = 26 + (isFusing ? 8 : 0);
        const vg = ctx.createRadialGradient(pos.x - 8, pos.y - 8, 4, pos.x, pos.y, size);
        vg.addColorStop(0, '#ffffff'); vg.addColorStop(1, '#e8e8e8');
        ctx.fillStyle = vg; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(pos.x, pos.y, size, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        if (isFusing) {
            const pulse = 0.5 + 0.5 * Math.sin(v.t * Math.PI / 0.45);
            ctx.strokeStyle = `rgba(255,170,0,${0.5 + pulse * 0.5})`; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(pos.x, pos.y, size + 5 + pulse * 5, 0, Math.PI * 2); ctx.stroke();
        }
        if (isDocking) { ctx.strokeStyle = '#88aaff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(pos.x, pos.y, size + 4, 0, Math.PI * 2); ctx.stroke(); }
        ctx.fillStyle = C_5HT;
        for (let j = 0; j < v.count; j++) {
            const a = j / VES_FULL * Math.PI * 2;
            ctx.beginPath(); ctx.arc(pos.x + Math.cos(a) * 12, pos.y + Math.sin(a) * 12, 3.5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = POOL_COLORS[v.pool]; ctx.font = 'bold 10px Courier New';
        ctx.fillText(v.pool, pos.x - 12, pos.y + 40);
    }
}
function drawMAO() {
    const size = 20 + MAO_POS.pulse * 10;
    if (MAO_POS.pulse > 0) { ctx.fillStyle = 'rgba(255,100,100,' + MAO_POS.pulse * 0.5 + ')'; ctx.beginPath(); ctx.arc(MAO_POS.x, MAO_POS.y, size + 12, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = C_MAO;
    ctx.beginPath(); ctx.arc(MAO_POS.x, MAO_POS.y, size, 0.3, Math.PI * 2 - 0.3); ctx.lineTo(MAO_POS.x, MAO_POS.y); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#000'; ctx.font = 'bold 11px Courier New';
    ctx.fillText('MAO', MAO_POS.x - 15, MAO_POS.y + 38);
    ctx.font = '10px Courier New'; ctx.fillText('5-HT→5-HIAA', MAO_POS.x - 30, MAO_POS.y + 50);
}
function drawSERTs() {
    for (let s of serts) {
        const size = 15 + Math.max(0, s.flash) * 8;
        if (s.flash > 0) { ctx.fillStyle = 'rgba(100,170,255,' + Math.max(0,s.flash) * 0.5 + ')'; ctx.beginPath(); ctx.arc(s.x, s.y, size + 10, 0, Math.PI * 2); ctx.fill(); }
        const sg = ctx.createRadialGradient(s.x - 5, s.y - 5, 2, s.x, s.y, size);
        sg.addColorStop(0, '#5b9be6'); sg.addColorStop(1, '#1b4f9c');
        ctx.fillStyle = sg; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(s.x, s.y, size, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = '8px Courier New'; ctx.textAlign = 'center';
        ctx.fillText('SERT', s.x, s.y + 3); ctx.textAlign = 'left';
        ctx.strokeStyle = 'rgba(34,102,204,0.2)'; ctx.lineWidth = 1; ctx.setLineDash([3,3]);
        ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
        if (s.blocked) {
            ctx.fillStyle = C_SSRI; ctx.strokeStyle = '#997700'; ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(s.x, s.y - size - 10); ctx.lineTo(s.x + 7, s.y - size - 3);
            ctx.lineTo(s.x, s.y - size + 4); ctx.lineTo(s.x - 7, s.y - size - 3);
            ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.strokeStyle = '#cc3333'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(s.x - size, s.y - size); ctx.lineTo(s.x + size, s.y + size); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(s.x + size, s.y - size); ctx.lineTo(s.x - size, s.y + size); ctx.stroke();
        }
    }
}
function drawAutoRec() {
    const desens = therapy.desens > 0.5;
    ctx.fillStyle = desens ? '#7a9a8a' : (autoRec.active ? '#006633' : C_AUTO);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.fillRect(autoRec.x - 12, autoRec.y - 14, 24, 26); ctx.strokeRect(autoRec.x - 12, autoRec.y - 14, 24, 26);
    if (autoRec.active) { ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(autoRec.x, autoRec.y, 30, 0, Math.PI * 2); ctx.stroke(); }
    ctx.fillStyle = '#006633'; ctx.font = 'bold 10px Courier New';
    ctx.fillText(desens ? '1A-авто (десенс)' : '1A-авто', autoRec.x - 30, autoRec.y - 20);
}
function drawPostRecs() {
    const short = {'5-HT1A (Gi)': '1A', '5-HT2A (Gq)': '2A', '5-HT3 (канал)': '3'};
    for (let r of postRecs) {
        const rSize = 14 + Math.max(0, r.flash) * 7;
        if (r.flash > 0) { ctx.globalAlpha = Math.max(0, r.flash) * 0.5; ctx.fillStyle = r.color; ctx.beginPath(); ctx.arc(r.x, r.y, rSize + 7, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
        const rg = ctx.createLinearGradient(r.x, r.y - rSize, r.x, r.y + rSize);
        rg.addColorStop(0, r.occ ? '#ff9cc9' : r.color);
        rg.addColorStop(1, r.occ ? '#d4548f' : shade(r.color, -25));
        ctx.fillStyle = rg; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
        ctx.fillRect(r.x - rSize, r.y - rSize, rSize * 2, rSize * 2);
        ctx.strokeRect(r.x - rSize, r.y - rSize, rSize * 2, rSize * 2);
        ctx.fillStyle = '#000'; ctx.font = 'bold 9px Courier New'; ctx.textAlign = 'center';
        ctx.fillText(short[r.type], r.x, r.y + 3);
        ctx.fillStyle = '#222'; ctx.font = '9px Courier New';
        ctx.fillText('n=' + r.bindings, r.x, r.y + 30);
        ctx.textAlign = 'left';
        ctx.globalAlpha = 0.12; ctx.fillStyle = r.color;
        ctx.beginPath(); ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
    }
}
function shade(hex, amt) {
    const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
    const c = p(hex).map(v => Math.max(0, Math.min(255, v + amt)));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function drawCalciumEvents() {
    for (let e of calciumEvents) {
        if (e.t < e.duration) {
            ctx.fillStyle = C_CA;
            for (let i = 0; i < 3; i++) {
                const offset = (i - 1) * 15; const progress = e.t / e.duration;
                ctx.shadowBlur = 10; ctx.shadowColor = C_CA;
                ctx.beginPath(); ctx.arc(e.x + offset, e.y - 15 + progress * 15, 4, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            }
            ctx.fillStyle = '#006622'; ctx.font = 'bold 10px Courier New';
            ctx.fillText('Ca²⁺', e.x - 12, e.y - 22);
        }
    }
}
function drawCortisol() {
    for (let c of cortisolMols) {
        ctx.fillStyle = C_CORT; ctx.strokeStyle = '#cc9900'; ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
            const r = i % 2 === 0 ? 7 : 3; const a = i * Math.PI / 5 - Math.PI / 2;
            const px = c.x + Math.cos(a) * r, py = c.y + Math.sin(a) * r;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    if (cortisolMols.length > 0) { ctx.fillStyle = '#cc9900'; ctx.font = '10px Courier New'; ctx.fillText('Кортизол', 320, 70); }
}
function drawReceptorFlashes() {
    for (let f of receptorFlashes) {
        const alpha = 1 - f.t / 0.8;
        ctx.strokeStyle = f.color; ctx.globalAlpha = alpha; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(f.x, f.y, 25 + f.t * 20, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
}
function drawMolecules() {
    for (let m of molecules) {
        if (m.state === 'bound' || m.state === 'auto') continue;
        let col = m.recycled ? (m.degradation ? C_5HT_DEGRAD : C_5HT_RECYCLED) : C_5HT;
        if (m.state === 'trp') col = C_TRP;
        if (m.state === 'htp') col = C_5HTP;
        if (m.state === 'kyn') col = C_KYN;
        if (m.state === 'kyna') col = C_KYNA;
        if (m.state === 'quin') col = C_QUIN;
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(m.x, m.y, 6, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(m.x, m.y, 5, 0, Math.PI * 2); ctx.fill();
        if (m.degradation && m.trail.length > 1) {
            ctx.strokeStyle = C_5HT_DEGRAD; ctx.globalAlpha = 0.4; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(m.trail[0].x, m.trail[0].y);
            for (let i = 1; i < m.trail.length; i++) ctx.lineTo(m.trail[i].x, m.trail[i].y);
            ctx.stroke(); ctx.globalAlpha = 1;
        }
    }
}
function drawHIAA() {
    for (let f of hiaaFlashes) {
        ctx.fillStyle = 'rgba(200,60,60,' + (1 - f.t / 1.5) + ')';
        ctx.font = '11px Courier New'; ctx.fillText('5-HIAA', f.x + 25, f.y - 10);
    }
}
function drawLabels() {
    ctx.fillStyle = '#000'; ctx.font = '12px Courier New';
    ctx.fillText('Пресинаптический нейрон', 620, 15);
    ctx.fillText('VMAT', 380, 55);
    ctx.textAlign = 'right';
    ctx.fillText('Синаптическая щель →', CLEFT_LEFT - 8, 365);
    ctx.textAlign = 'left';
}
function drawHistory() {
    const px = 300, py = 545, pw = 440, ph = 130;
    ctx.fillStyle = 'rgba(255,255,255,0.93)'; ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.fillRect(px, py, pw, ph); ctx.strokeRect(px, py, pw, ph);
    ctx.fillStyle = '#000'; ctx.font = 'bold 11px Courier New';
    ctx.fillText('ИСТОРИЯ 180с', px + 10, py + 16);
    ctx.fillStyle = '#008877'; ctx.fillText('— выброс (мол/с, 0-4)', px + 110, py + 16);
    ctx.fillStyle = '#bb2222'; ctx.fillText('— щель (мол, 0-80)', px + 300, py + 16);
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1;
    for (let g = 1; g < 4; g++) {
        const gy = py + 24 + (ph - 40) * g / 4;
        ctx.beginPath(); ctx.moveTo(px + 8, gy); ctx.lineTo(px + pw - 8, gy); ctx.stroke();
    }
    if (histRel.length < 2) {
        ctx.fillStyle = '#888'; ctx.font = '10px Courier New';
        ctx.fillText('накопление данных...', px + 150, py + 75);
        return;
    }
    const n = histRel.length;
    const x0 = px + 8, x1 = px + pw - 8;
    const yBase = py + ph - 12, yTop = py + 24;
    ctx.strokeStyle = '#008877'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
        const x = x0 + (i / 179) * (x1 - x0);
        const y = yBase - Math.min(1, histRel[i] / 4) * (yBase - yTop);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.strokeStyle = '#bb2222'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
        const x = x0 + (i / 179) * (x1 - x0);
        const y = yBase - Math.min(1, histCleft[i] / 80) * (yBase - yTop);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = '#888'; ctx.font = '9px Courier New';
    ctx.fillText('-180с', x0, py + ph - 2);
    ctx.textAlign = 'right';
    ctx.fillText('сейчас', x1, py + ph - 2);
    ctx.textAlign = 'left';
}
function drawLegend() {
    const x = 880, y = 505, w = 310, h = 160;
    ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = '#000'; ctx.font = 'bold 12px Courier New';
    ctx.fillText('ЛЕГЕНДА ЦВЕТОВ', x + 12, y + 18);
    const items = [
        [C_5HT, '5-HT свежий (в щели)'],
        [C_5HT_RECYCLED, '5-HT → везикула'],
        [C_5HT_DEGRAD, '5-HT → MAO'],
        [C_KYN, 'KYN'], [C_KYNA, 'KYNA'], [C_QUIN, 'QUIN'],
        [C_CORT, 'Кортизол'], [C_SSRI, 'СИОЗС на SERT']
    ];
    let yy = y + 36;
    for (let it of items) {
        ctx.fillStyle = it[0];
        ctx.beginPath(); ctx.arc(x + 18, yy - 4, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.font = '10px Courier New';
        ctx.fillText(it[1], x + 32, yy); yy += 16;
    }
}
function drawDashboard() {
    const x = 880, y = 20, w = 310, h = 470;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
    const prm = P();
    const tdoEff = prm.tdo * tdoRamp;
    let status, statusColor;
    if (stressLevel < 0.3) { status = 'ГОМЕОСТАЗ'; statusColor = '#008844'; }
    else if (stressLevel < 0.7) { status = 'ПЕРЕХОД...'; statusColor = '#cc8800'; }
    else { status = 'ТРЕВОГА'; statusColor = '#cc2222'; }
    ctx.fillStyle = '#000'; ctx.font = 'bold 14px Courier New';
    ctx.fillText('ДАШБОРД · ' + status, x + 12, y + 24);
    const relWin = ringSum('rel'), upWin = ringSum('up'), synWin = ringSum('syn'), maoWin = ringSum('mao');
    const kynWin = ringSum('kyn'), kynaWin = ringSum('kyna'), quinWin = ringSum('quin');
    const diffWin = ringSum('diff'), lostWin = ringSum('lost');
    const ev2Win = ringSum('ev2'), ev3Win = ringSum('ev3');
    const cleftN = molecules.filter(m => m.state === 'cleft').length;
    const range = normRange();
    const inRange = cleftN >= range[0] && cleftN <= range[1];
    const cleftColor = inRange ? '#008844' : '#cc8800';
    const evTotal = postRecs[0].bindings + postRecs[1].bindings + postRecs[2].bindings;
    const relHz = (relWin / 10).toFixed(1);
    const upHz = (upWin / 10).toFixed(1);
    ctx.font = '11px Courier New';
    const lines = [
        ['Время: ' + simTime.toFixed(1) + ' c', '#00aa00'],
        ['Выброс: ' + relWin + ' (' + relHz + ' Гц)', '#008877'],
        ['Захват SERT: ' + upWin + ' (' + upHz + ' Гц)', '#5566cc'],
        ['MAO окно: ' + maoWin + ' | сессия: ' + maoTotal, '#cc4444'],
        ['Синтез 5-HT: ' + synWin, '#886622'],
        ['KYN: ' + kynWin + ' (KYNA=' + kynaWin + ' QUIN=' + quinWin + ')', '#7744cc'],
        ['Диффузия: ' + diffWin + ' / Потеряно: ' + lostWin, '#999999'],
        ['5-HT в щели: ' + cleftN + ' (~' + (cleftN * NM_PER_MOL) + ' нМ)', cleftColor],
        ['  норма фазы: ' + (range[0]*NM_PER_MOL) + '-' + (range[1]*NM_PER_MOL) + ' нМ', cleftColor],
        ['--- СИГНАЛИЗАЦИЯ (сессия) ---', '#000000'],
        ['≥1 связь: ' + signaledTotal, '#cc2277'],
        ['1A=' + postRecs[0].bindings + ' 2A=' + postRecs[1].bindings + ' 3=' + postRecs[2].bindings, '#4488ff'],
        ['Распр: ' + (evTotal ? Math.round(postRecs[0].bindings/evTotal*100) : 0) + '/' + (evTotal ? Math.round(postRecs[1].bindings/evTotal*100) : 0) + '/' + (evTotal ? Math.round(postRecs[2].bindings/evTotal*100) : 0), '#4488ff'],
        ['2A+3/10с: ' + (ev2Win + ev3Win) + ' (нагрузка/побочки)', '#ff8844'],
        ['--- ТЕРАПИЯ ---', '#000000'],
        ['Фаза: ' + THERAPY_PHASES[targetPhase].name, '#b8860b'],
        ['Блок SERT: ' + Math.round(therapy.block * 100) + '%', '#b8860b'],
        ['Десенс авто: ' + Math.round(therapy.desens * 100) + '% | Постадапт: ' + Math.round(therapy.adapt * 100) + '%', '#b8860b'],
        ['--- РЕГУЛЯЦИЯ ---', '#000000'],
        ['Кортизол: ' + Math.round(prm.cortisol * 100) + '%', '#cc9900'],
        ['TDO: ' + Math.round(tdoEff * 100) + '% (ramp ' + Math.round(tdoRamp * 100) + '%)', '#7744cc'],
        ['MAO: ' + Math.round(prm.mao * 100) + '% | 1Aчув: ' + Math.round(prm.ht1a * 100) + '%', '#cc4444'],
        ['2Aчув: ' + Math.round(prm.ht2a * 100) + '% | 3чув: ' + Math.round(prm.ht3 * 100) + '%', '#4488ff'],
        ['Барабан: ' + vesicles.map(v => v.count).join(','), '#886622'],
        ['(окно 10с; 1 мол ≈ 2 нМ)', '#888888']
    ];
    let yy = y + 46;
    for (let L of lines) { ctx.fillStyle = L[1]; ctx.fillText(L[0], x + 12, yy); yy += 18; }
    ctx.fillStyle = statusColor; ctx.font = 'bold 14px Courier New';
    ctx.fillText('СТАТУС: ' + status, x + 12, y + h - 14);
}
function drawTooltip() {
    if (mouse.x > 870) return;
    let hit = null;
    for (let t of tooltips) { if (dist(mouse.x, mouse.y, t.x, t.y) < t.r) { hit = t; break; } }
    if (!hit) return;
    const maxLen = Math.max(hit.title.length, ...hit.lines.map(l => l.length));
    const bw = maxLen * 7 + 20, bh = hit.lines.length * 14 + 30;
    let bx = mouse.x + 15, by = mouse.y + 15;
    if (bx + bw > W - 5) bx = mouse.x - bw - 15;
    if (by + bh > H - 5) by = mouse.y - bh - 15;
    ctx.fillStyle = 'rgba(255,255,240,0.97)'; ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.fillRect(bx, by, bw, bh); ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = '#000'; ctx.font = 'bold 12px Courier New';
    ctx.fillText(hit.title, bx + 10, by + 18);
    ctx.font = '11px Courier New';
    let yy = by + 34;
    for (let l of hit.lines) { ctx.fillText(l, bx + 10, yy); yy += 14; }
}

let last = performance.now();
function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt); draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
